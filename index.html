<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wave Checker – Elliott-Wellen trainieren</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#EFF3F1;--ink:#14313B;--mut:#5B7079;--card:#fff;--line:#C9D6D3;--up:#17806A;--dn:#C0452D;--warn:#9A6414;--btn:#14313B;--btnt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1D22;--ink:#E4EEEC;--mut:#8FA7A8;--card:#16282E;--line:#2A4249;--up:#4CC2A4;--dn:#F07A5F;--warn:#E3B04B;--btn:#E4EEEC;--btnt:#0F1D22}}
:root[data-theme="dark"]{--bg:#0F1D22;--ink:#E4EEEC;--mut:#8FA7A8;--card:#16282E;--line:#2A4249;--up:#4CC2A4;--dn:#F07A5F;--warn:#E3B04B;--btn:#E4EEEC;--btnt:#0F1D22}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:1.5rem;font-weight:800;margin:0;cursor:pointer}
h2{font-size:1.15rem;margin:0 0 6px}
.stats{display:flex;gap:14px;font-size:.9rem;color:var(--mut)}
.stats b{color:var(--ink)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--up);transition:width .3s}
.dock{position:sticky;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);padding:10px 0;margin:0 0 12px}.dock p{margin:0 0 8px}#menu,#tolearn{margin-bottom:10px;padding:8px 10px;font-size:.92rem} /* passen am Handy (ab 360 px) nebeneinander */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
button{font:inherit;cursor:pointer;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:8px;padding:8px 14px;margin:4px 6px 4px 0}
button.p{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
button.on{background:var(--ink);color:var(--bg)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.mut{color:var(--mut);font-size:.92rem}
.ok{color:var(--up);font-weight:600}.bad{color:var(--dn);font-weight:600}.warn{color:var(--warn)}
.chart{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
svg{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.lab{font:600 11px "Bricolage Grotesque",system-ui,sans-serif;fill:var(--ink);text-anchor:middle}
.hr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}#learn{margin:0}
/* Lernbereich: Text aus lernen/regelwerk-lernversion.md, am Handy ohne seitliches Scrollen */
.learn{overflow-wrap:break-word}.learn h1{font-size:1.4rem;margin:12px 0 8px}.learn h2{margin:32px 0 8px;padding-top:12px;border-top:1px solid var(--line);scroll-margin-top:12px}
.learn ul,.learn ol{padding-left:22px}.learn li{margin:4px 0}
.learn table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.92rem}
.learn th,.learn td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;hyphens:auto;-webkit-hyphens:auto}.learn th{background:var(--card)}
.learn figure{margin:18px 0}.learn figure img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px;cursor:zoom-in}
.learn figcaption{font-size:14px;line-height:1.4;color:var(--mut);margin-top:6px} /* TradingView-Hinweis: immer direkt unter dem Bild, mindestens 13 px */
.toc ol{margin:6px 0 0}.toc a{color:var(--ink)}.ueben{margin:14px 0 0}
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;cursor:zoom-out}
.lb img{max-width:100%;max-height:80vh;height:auto}.lb p{color:#fff;font-size:14px;margin:8px 0 0;text-align:center;max-width:760px}
</style>
</head>
<body>
<main>
<header><h1 id="home" tabindex="0">Wave Checker</h1>
<div class="hr"><div class="stats"><span>Level <b id="lv">1</b></span><span>Punkte <b id="pt">0</b></span><span>Serie <b id="sr">0</b></span></div><button class="p" id="learn">Elliott-Wellen lernen</button></div></header>
<div class="bar"><i id="pb" style="width:0"></i></div>
<button id="menu" hidden>← Hauptmenü</button><button id="tolearn" hidden>← Zurück zum Regelwerk</button>
<div id="view"></div>
</main>
<script>
/* ===== Wave Checker – Prototyp: Impuls (S.38) und Zigzag (S.42) =====
   Aufbau: 1) Regeln je Muster (jede Regel = eine Prüffunktion mit interner ID)
           2) Chart-Generator  3) Zeichnen  4) Spielmodi.
   Alle Prüfungen laufen im Code, ohne KI. Regel-IDs sieht nur der Code, nie der Nutzer. */

// ---- 1) Regeln. Alle Werte u/v sind normalisiert: Punkt 0 = 0, Impuls zeigt nach oben, Zigzag-Welle A nach unten.
// hard=1: harte Regel (Zählung falsch). hard=0: harte Orientierung (nur Warnung).
const L=(v,k)=>Math.abs(v[k]-v[k-1]); // Länge der Welle zwischen Punkt k-1 und k
const IMPR={
 'IMP-1':{page:38,hard:1,wave:'2',name:'Welle 2 unter dem Start von Welle 1',
  hint:'Schau auf Welle 2: Wie weit läuft sie zurück?',
  ex:'Welle 2 darf den Startpunkt der Welle 1 nicht unterschreiten (im Abwärtstrend: nicht überschreiten).',
  ok:v=>v[2]>=v[0]},
 'IMP-2':{page:38,hard:1,wave:'3',name:'Welle 3 ist die kürzeste Impulswelle',
  hint:'Vergleiche die Längen der Wellen 1, 3 und 5.',
  ex:'Welle 3 darf nie die kürzeste der Impulswellen 1, 3 und 5 sein.',
  ok:v=>!(L(v,3)<L(v,1)&&L(v,3)<L(v,5))},
 'IMP-3':{page:38,hard:1,wave:'4',name:'Welle 4 überschneidet Welle 1',
  hint:'Prüfe, wie tief Welle 4 läuft. Berührt sie das Preisterritorium von Welle 1?',
  ex:'Welle 4 darf das Preisterritorium der Welle 1 nicht schneiden (Ausnahme: Diagonale).',
  ok:v=>v[4]>=v[1]},
 'IMP-4':{page:38,hard:1,wave:'1',name:'Falsche Richtung einer Welle',
  hint:'Prüfe die Richtung jeder Welle: 1, 3, 5 laufen mit dem Trend, 2 und 4 dagegen.',
  ex:'Welle 1, 3 und 5 verlaufen immer in Trendrichtung, die Wellen 2 und 4 sind Korrekturen dagegen.',
  ok:v=>v[1]>v[0]&&v[2]<v[1]&&v[3]>v[2]&&v[4]<v[3]&&v[5]>v[4]},
 'W3-4':{page:null,hard:0,wave:'3',name:'Welle 3 expandiert weniger als 123,6 %',
  hint:'Vergleiche Welle 3 mit Welle 1.',
  ex:'Harte Orientierung: Welle 3 sollte mindestens 123,6 % von Welle 1 erreichen. Das ist eine Warnung, kein sicherer Fehler.',
  ok:v=>L(v,3)>=1.236*L(v,1)}
};
const ZZR={ // Zigzag: Punkte 0, A, B, C (Abwärtskorrektur, im Aufwärtsfall spiegelbildlich)
 'ZZ-2':{page:42,hard:1,wave:'B',name:'Welle B überschreitet den Start von Welle A',
  hint:'Schau auf das Ende von Welle B: Wie weit läuft sie gegen Welle A zurück?',
  ex:'Welle B darf den Startpunkt der Welle A nicht überschreiten (bei steigenden Preisen: nicht unterschreiten).',
  ok:u=>u[2]<u[0]},
 'ZZ-3':{page:42,hard:1,wave:'C',name:'Welle C endet nicht jenseits vom Ende der Welle A',
  hint:'Vergleiche das Ende von Welle C mit dem Ende von Welle A.',
  ex:'Welle C muss unter dem Endpunkt der Welle A enden (bei steigenden Preisen: darüber).',
  ok:u=>u[3]<u[1]}
};
const pct=x=>(Math.round(x*1000)/10).toString().replace('.',',')+' %';
const PAT={
 imp:{key:'imp',title:'Impuls',labels:['0','1','2','3','4','5'],waves:['1','2','3','4','5'],rules:IMPR,viol:['IMP-1','IMP-2','IMP-3'],
  sign:p=>p[1]>=p[0]?1:-1, // Richtung: Welle 1 bestimmt den Trend
  endMsg:'Der Chart endet im Extrem von Welle 5. Setze Punkt 5 an das letzte Hoch (im Abwärtstrend: Tief) des Charts.',
  info:v=>'<p class="mut">Orientierung: Welle 2 lief '+pct(L(v,2)/L(v,1))+' zurück (häufig 50, 61,8 oder 78,6 %), Welle 4 '+pct(L(v,4)/L(v,3))+' (häufig 38,2 oder 50 %).'+(v[5]<v[3]?' Welle 5 endet unter dem Hoch von Welle 3: eine Truncation, die in echten Charts selten vorkommt.':'')+'</p>'},
 zig:{key:'zig',title:'Zigzag',labels:['0','A','B','C'],waves:['A','B','C'],rules:ZZR,viol:['ZZ-2','ZZ-3'],
  sign:p=>p[1]<=p[0]?1:-1, // Richtung: Welle A bestimmt die Korrektur
  struct:u=>u[1]<u[0]&&u[2]>u[1]&&u[3]<u[2], // App-Vorgabe: A und C laufen in eine Richtung, B dagegen
  structMsg:'Bei einem Zigzag laufen A und C in dieselbe Richtung, B läuft dagegen. Prüfe die Richtung deiner Punkte.',
  endMsg:'Der Chart endet im Extrem von Welle C. Setze Punkt C an das letzte Tief (bei steigenden Preisen: Hoch) des Charts.',
  info:v=>'<p class="mut">Orientierung: Welle B lief '+pct(L(v,2)/L(v,1))+' von A zurück (maximal knapp unter 100 %), Welle C erreicht '+pct(L(v,3)/L(v,1))+' von A (häufig 100 %, zwischen 61,8 und 161,8 %).</p><p class="mut">Hinweis: Dass A und C fünfteilig sind, prüft die App erst in der späteren Subwellen-Stufe.</p>'}
};
// Flats (Punkte 0, A, B, C): A und B dreiteilig, C fünfteilig. Drei Varianten, jede mit eigenen Regeln.
const MIR=' (bei steigenden Preisen spiegelbildlich)';
const FLR={
 fr:{ // Regular Flat
  'FR-2':{page:46,hard:1,wave:'B',name:'Welle B überschreitet den Start von Welle A',
   hint:'Schau, wo Welle B endet: Nähert sie sich dem Start von Welle A an oder schießt sie darüber?',
   ex:'Beim Regular Flat nähert sich Welle B dem Startpunkt der Welle A an, statt ihn zu überschreiten.'+MIR,ok:u=>u[2]<u[0]},
  'FR-3':{page:46,hard:1,wave:'C',name:'Welle C endet nicht unter dem Tief von Welle A',
   hint:'Vergleiche das Ende von Welle C mit dem Ende von Welle A.',
   ex:'Beim Regular Flat endet Welle C leicht unter dem Tief von Welle A.'+MIR,ok:u=>u[3]<u[1]}},
 fe:{ // Expanded Flat
  'FE-2':{page:46,hard:1,wave:'B',name:'Welle B überschreitet den Start von Welle A nicht',
   hint:'Schau, wo Welle B endet: Kommt sie über den Start von Welle A hinaus?',
   ex:'Beim Expanded Flat überschreitet Welle B den Startpunkt der Welle A.'+MIR,ok:u=>u[2]>u[0]},
  'FE-3':{page:46,hard:1,wave:'C',name:'Welle C endet nicht unter dem Tief von Welle A',
   hint:'Vergleiche das Ende von Welle C mit dem Ende von Welle A.',
   ex:'Beim Expanded Flat endet Welle C unterhalb des Tiefs von Welle A.'+MIR,ok:u=>u[3]<u[1]}},
 fru:{ // Running Flat
  'FRU-2':{page:46,hard:1,wave:'B',name:'Welle B überschießt den Start von Welle A nicht',
   hint:'Schau, wo Welle B endet: Schießt sie über den Start von Welle A hinaus?',
   ex:'Beim Running Flat überschießt Welle B den Startpunkt der Welle A.'+MIR,ok:u=>u[2]>u[0]},
  'FRU-3':{page:46,hard:1,wave:'C',name:'Welle C bildet ein neues Tief unter Welle A',
   hint:'Vergleiche das Ende von Welle C mit dem Ende von Welle A.',
   ex:'Beim Running Flat schafft es Welle C nicht, ein neues Tief unterhalb der Welle A auszubilden.'+MIR,ok:u=>u[3]>u[1]}}
};
// Gemeinsame harte Orientierung für Welle B in Flats
const WB2={page:null,hard:0,wave:'B',name:'Welle B liegt außerhalb von 88,7 % bis 161,8 % der Welle A',
 hint:'Vergleiche die Länge von Welle B mit Welle A.',
 ex:'Harte Orientierung: Welle B retraced mindestens 88,7 % bis maximal 161,8 % der Welle A. Das ist eine Warnung, kein sicherer Fehler.',
 ok:u=>{const r=L(u,2)/L(u,1);return r>=.887&&r<=1.618}};
const flatPat=(key,title,viol)=>({key,title,labels:['0','A','B','C'],waves:['A','B','C'],rules:{...FLR[key],'WB-2':WB2},viol,
 sign:PAT.zig.sign,struct:PAT.zig.struct,structMsg:PAT.zig.structMsg,
 endMsg:'Der Chart endet im Extrem von Welle C. Setze Punkt C an das letzte Tief (bei steigenden Preisen: Hoch) des Charts.',
 info:v=>'<p class="mut">Orientierung: Welle B lief '+pct(L(v,2)/L(v,1))+' von A zurück (Regelwerk: mindestens 88,7 %, höchstens 161,8 %). Welle C erreicht '+pct(L(v,3)/L(v,1))+' von A (häufig 61,8 %, bis 261,8 %).</p><p class="mut">Hinweis: Dass A und B dreiteilig und C fünfteilig sind, prüft die App erst in der späteren Subwellen-Stufe.</p>'});
PAT.fr=flatPat('fr','Regular Flat',['FR-2','FR-3']);
PAT.fe=flatPat('fe','Expanded Flat',['FE-2','FE-3']);
PAT.fru=flatPat('fru','Running Flat',['FRU-2','FRU-3']);
// Dreiecke (Punkte 0, A, B, C, D, E): fünf dreiteilige Wellen. Kontrahierend oder expandierend.
const TRR={
 trk:{'DRE-7':{page:50,hard:1,wave:'B',name:'Eine Welle ist nicht kürzer als die vorangegangene',
  hint:'Vergleiche die Längen der fünf Wellen: Wird jede Welle kürzer als die davor?',
  ex:'Beim kontrahierenden Dreieck ist Welle A die längste der fünf Wellen, und jede Welle ist kürzer als die vorangegangene.',
  ok:u=>L(u,1)>L(u,2)&&L(u,2)>L(u,3)&&L(u,3)>L(u,4)&&L(u,4)>L(u,5)}},
 tre:{'DRE-8':{page:50,hard:1,wave:'B',name:'Eine Welle ist nicht länger als die vorangegangene',
  hint:'Vergleiche die Längen der fünf Wellen: Wird jede Welle länger als die davor?',
  ex:'Beim expandierenden Dreieck ist Welle A die kürzeste der fünf Wellen, und jede Welle ist länger als die vorangegangene.',
  ok:u=>L(u,1)<L(u,2)&&L(u,2)<L(u,3)&&L(u,3)<L(u,4)&&L(u,4)<L(u,5)}}
};
const triPat=(key,title,viol)=>({key,title,labels:['0','A','B','C','D','E'],waves:['A','B','C','D','E'],rules:TRR[key],viol,
 sign:p=>p[1]>=p[0]?1:-1,
 struct:u=>u[1]>u[0]&&u[2]<u[1]&&u[3]>u[2]&&u[4]<u[3]&&u[5]>u[4], // App-Vorgabe: die Richtung wechselt von Welle zu Welle
 structMsg:'Bei einem Dreieck wechselt die Richtung von Welle zu Welle: A, C und E laufen in eine Richtung, B und D dagegen. Prüfe die Richtung deiner Punkte.',
 endMsg:'Der Chart endet im Extrem von Welle E. Setze Punkt E an das letzte Hoch bzw. Tief des Charts.',
 info:v=>'<p class="mut">Orientierung: Dreiecke verlaufen meist flach und treten häufig in Welle 4 auf. Verhältnisse: B '+pct(L(v,2)/L(v,1))+' von A, C '+pct(L(v,3)/L(v,2))+' von B, D '+pct(L(v,4)/L(v,3))+' von C, E '+pct(L(v,5)/L(v,4))+' von D.</p><p class="mut">Hinweis: Dass jede der fünf Wellen dreiteilig ist, prüft die App erst in der späteren Subwellen-Stufe.</p>'});
PAT.trk=triPat('trk','Kontrahierendes Dreieck',['DRE-7']);
PAT.tre=triPat('tre','Expandierendes Dreieck',['DRE-8']);
// Diagonalen (Punkte 0 bis 5): Überlappung von Welle 1 und 4 ist das Kennzeichen. Leading, Beendend, Expandierend.
const OVL={page:null,where:'Regelwerk, Abschnitt Diagonale',hard:1,wave:'4',name:'Welle 4 überlappt Welle 1 nicht',
 hint:'Prüfe, ob Welle 4 in das Preisterritorium von Welle 1 hineinläuft.',
 ex:'Bei einer Diagonale überlappen sich die Wellen 1 und 4: Welle 4 läuft in das Preisterritorium der Welle 1 hinein.',
 ok:u=>u[4]<u[1]};
// Fortschritt (DIAG-5, Lenny 21.10.2026): Ohne diese Regel erfüllte ein seitwärts laufendes Dreieck rechnerisch alle Diagonalen-Regeln.
const DPROG={page:null,where:'Regelwerk, Abschnitt Diagonale',hard:1,wave:'3',name:'Die Diagonale kommt nicht voran',
 hint:'Vergleiche die Enden der Wellen 1, 3 und 5: Endet jede höher als die davor?',
 ex:'Bei einer Diagonale endet Welle 3 über dem Ende der Welle 1 und Welle 5 über dem Ende der Welle 3 (im Abwärtstrend spiegelbildlich).',
 ok:u=>u[3]>u[1]&&u[5]>u[3]};
const W3KURZ=a=>({page:null,where:'Regelwerk, Abschnitt Diagonale',hard:1,wave:'3',name:'Welle 3 ist die kürzeste Impulswelle',
 hint:'Vergleiche die Längen der Wellen 1, 3 und 5.',ex:'Welle 3 darf bei der '+a+' niemals die kürzeste der Impulswellen sein.',
 ok:u=>!(L(u,3)<L(u,1)&&L(u,3)<L(u,5))});
const DRL={
 dl:{'IMP-1':IMPR['IMP-1'],'DIAG-2':OVL,'DIAG-5':DPROG,
  'DL-4':{page:null,where:'Regelwerk, Abschnitt Diagonale',hard:1,wave:'3',name:'Welle 1 ist nicht die längste Welle',
   hint:'Vergleiche Welle 1 mit allen anderen Wellen: Ist sie die längste?',ex:'Bei der Leading Diagonale ist Welle 1 die längste der fünf Wellen.',
   ok:u=>L(u,1)>L(u,2)&&L(u,1)>L(u,3)&&L(u,1)>L(u,4)&&L(u,1)>L(u,5)},
  'DL-6':W3KURZ('Leading Diagonale'),
  'DL-8':{page:null,where:'Regelwerk, Abschnitt Diagonale',hard:1,wave:'5',name:'Welle 5 ist länger als Welle 3',
   hint:'Vergleiche Welle 5 mit Welle 3.',ex:'Welle 5 darf bei der Leading Diagonale niemals länger als Welle 3 sein.',
   ok:u=>L(u,5)<=L(u,3)}},
 db:{'IMP-1':IMPR['IMP-1'],'DIAG-2':OVL,'DIAG-5':DPROG,
  'DB-8':W3KURZ('Beendenden Diagonale'),
  'DB-10':{page:null,where:'Regelwerk, Abschnitt Diagonale',hard:1,wave:'5',name:'Welle 5 ist nicht kürzer als Welle 3',
   hint:'Vergleiche Welle 5 mit Welle 3.',ex:'Bei der Beendenden Diagonale darf Welle 5 nicht länger als Welle 3 sein (maximal 99,99 % von Welle 3).',
   ok:u=>L(u,5)<L(u,3)},
  'DB-4':{page:null,where:'Regelwerk, Abschnitt Diagonale',hard:1,wave:'3',name:'Welle 3 ist nicht kürzer als Welle 1',
   hint:'Vergleiche Welle 3 mit Welle 1.',ex:'Bei der Beendenden Diagonale ist Welle 3 kürzer als Welle 1.',
   ok:u=>L(u,3)<L(u,1)}},
 de:{'IMP-1':IMPR['IMP-1'],'DIAG-2':OVL,'DIAG-5':DPROG,
  'DE-3':{page:null,where:'Regelwerk, Abschnitt Diagonale',hard:1,wave:'3',name:'Die Wellen 1, 3 und 5 werden nicht immer länger',
   hint:'Vergleiche die Längen der Wellen 1, 3 und 5: Wird jede länger als die davor?',
   ex:'Bei der Expandierenden Diagonale werden die Wellen immer länger: Welle 1 ist die kürzeste, Welle 5 die längste.',
   ok:u=>L(u,1)<L(u,3)&&L(u,3)<L(u,5)},
  // Welle-4-Retracement der Expandierenden Diagonale (Lenny, 20.10.2026), gemessen über Start- und Endpunkt der Welle 3
  'DE-9':{page:null,where:'Regelwerk, Abschnitt Diagonale',hard:1,wave:'4',name:'Welle 4 retraced mehr als 99,9 % der Welle 3',
   hint:'Miss, wie weit Welle 4 von Start bis Ende der Welle 3 zurückläuft.',
   ex:'Harte Grenze: Bei der Expandierenden Diagonale darf Welle 4 höchstens 99,9 % der Welle 3 retracen.',
   ok:u=>L(u,4)/L(u,3)<=.999},
  'DE-9o':{page:null,where:'Regelwerk, Abschnitt Diagonale',hard:0,lvl:'o',wave:'4',name:'Welle 4 retraced nicht zwischen 50 % und 88,7 %',
   hint:'Miss, wie weit Welle 4 von Start bis Ende der Welle 3 zurückläuft.',
   ex:'Meist retraced Welle 4 zwischen 50 % und 88,7 % der Welle 3, am häufigsten 61,8 % (Orientierung, kein Fehler).',
   ok:u=>{const r=L(u,4)/L(u,3);return r>=.5&&r<=.887}}}
};
const RET=v=>'Orientierung: Welle 2 lief '+pct(L(v,2)/L(v,1))+' zurück, Welle 4 '+pct(L(v,4)/L(v,3))+' (häufig 61,8 %).';
const diagPat=(key,title,viol,implied,info)=>({key,title,labels:['0','1','2','3','4','5'],waves:['1','2','3','4','5'],rules:DRL[key],viol,implied,
 sign:PAT.trk.sign,struct:PAT.trk.struct,structMsg:'Bei einer Diagonale laufen die Wellen 1, 3 und 5 in Trendrichtung, die Wellen 2 und 4 dagegen. Prüfe die Richtung deiner Punkte.',
 endMsg:PAT.imp.endMsg,info});
PAT.dl=diagPat('dl','Leading Diagonale',['DIAG-2','DL-4','DL-8'],{'DL-8':['DL-6']},
 v=>'<p class="mut">'+RET(v)+'</p><p class="mut">Hinweis: Dass die Wellen als 5-3-5-3-5 oder 3-3-3-3-3 aufgebaut sind, prüft die App erst in der späteren Subwellen-Stufe.</p>');
PAT.db=diagPat('db','Beendende Diagonale',['DIAG-2','DB-10','DB-4'],{'DB-10':['DB-8']},

function leg(a,b,n,fr){
 const k=fr.length-1,w=Array.from({length:k},()=>rnd(.8,1.4)),tot=w.reduce((x,y)=>x+y),idx=[0];let t=0;
 w.forEach(x=>{t+=x;idx.push(Math.round(t/tot*n))});
 for(let j=1;j<=k;j++)if(idx[j]<=idx[j-1])idx[j]=idx[j-1]+1;
 const out=[];
 for(let j=0;j<k;j++){const pa=a+(b-a)*fr[j],pb=a+(b-a)*fr[j+1],lo=Math.min(pa,pb),hi=Math.max(pa,pb);
  for(let i=idx[j];i<idx[j+1];i++){const s=(i-idx[j])/(idx[j+1]-idx[j]);let x=pa+(pb-pa)*s;
   if(i>idx[j])x+=(Math.random()-.5)*(hi-lo)*.3;out.push(Math.min(hi,Math.max(lo,x)));}}
 out.idx=idx; // Kerzenindex der Teilpunkte (für die Subwellen-Stufe)

}

// Muster der Teile wählen (nur Fehler finden): frei wählbar, nur W darf kein Dreieck sein; mit DRE-1 steht ein Dreieck in W
function pickNames(P,violate){
 const pk=a=>a[Math.floor(Math.random()*a.length)],nonTri=ARTEN.filter(a=>a!=='Dreieck');
 return[violate==='DRE-1'?'Dreieck':pk(nonTri),pk(ARTEN),P.key==='tz'?(violate==='WZ-1'?'Dreieck':pk(nonTri)):pk(ARTEN)]; // W nie Dreieck (DRE-1), Z nie Dreieck (WZ-1), X und Y frei
}
function makeRound(P,violate,named){
 const dir=Math.random()<.5?1:-1,B=600;let x,piv,lab,vw,alt;
 if(P.key==='imp'){const v=genImp(violate),S=9;x=[];
  for(let k=1;k<=5;k++){const a=v[k-1],b=v[k];
   for(let s=0;s<S;s++){let y=a+(b-a)*s/S+(s?(Math.random()-.5)*Math.abs(b-a)*.28:0);
    x.push(Math.min(Math.max(y,Math.min(a,b)),Math.max(a,b)));}}
  x.push(v[5]);piv=[0,1,2,3,4,5].map(k=>k*S);
 }else{const num=!P.parts||!violate||/^WX/.test(violate),v=P.gen(num?violate:null),q=P.shape;x=[];piv=q.piv;
  const nl=q.piv.length-1,names=(named&&P.parts)?pickNames(P,violate):null;
  for(let k=0;k<nl;k++){const pi=names?P.partLeg.indexOf(k):-1;x.push(...leg(v[k],v[k+1],q.piv[k+1]-q.piv[k],pi>=0&&names[pi]==='Dreieck'?triF():q.fr[k]()));}
  x.push(v[nl]);
  if(names){ // Beschriftung der Pivotpunkte mit dem Muster des Teils
   lab=P.labels.map((l,k)=>{const pi=P.partLeg.indexOf(k-1);return pi>=0?l+' '+names[pi]:l});
   if(violate==='DRE-1')vw='W';if(violate==='WZ-1')vw='Z';}}
 return{P,dir,pr:x.map(y=>B+dir*y),piv,violate,vwave:violate?(vw||P.lastVW):undefined,alt,lab};
}

// ---- 3) Zeichnen: nur kleine Zahlen an den Extremen, keine Punkte.
const W=720,H=340,X0=30,DX=660/45;
// Ziehen von Punkten (PC und Handy). Wichtig fürs Handy: Das SVG-Element bleibt während des Ziehens bestehen
// (nur sein Inhalt wird neu gezeichnet) und hält den Finger per Pointer-Capture fest. Früher wurde das ganze SVG ersetzt;
// dann kam auf dem Handy das "Loslassen" nicht mehr an, und der alte Punkt "klebte" am Finger.
let DRAG=null; // Aufräumfunktion der laufenden Ziehaktion
function startDrag(svg,e,move,end){
 if(DRAG)DRAG();
 try{svg.setPointerCapture(e.pointerId)}catch(_){}
 let on=true;
 const stop=()=>{if(!on)return;on=false;DRAG=null;['pointermove','pointerup','pointercancel','lostpointercapture'].forEach((t,i)=>svg.removeEventListener(t,i?up:move))};
 const up=()=>{if(!on)return;stop();end()};
 svg.addEventListener('pointermove',move);['pointerup','pointercancel','lostpointercapture'].forEach(t=>svg.addEventListener(t,up));
 DRAG=stop;
}
const redraw=(svg,html)=>{svg.innerHTML=html.slice(html.indexOf('>')+1,html.lastIndexOf('</svg>'))}; // nur den Inhalt tauschen
const TOL=2; // erlaubte Abweichung beim Setzen eines Punktes, in Kerzen
function draw(R,marks,showPiv,tl){ // tl: gesetzte Dreieckspunkte (0,A,B,C,D,E) für die Trendlinien, sonst null
 const lo=Math.min(...R.pr),hi=Math.max(...R.pr),Y=p=>20+(hi-p)/(hi-lo)*300,X=i=>X0+i*DX;
 let s='<svg id="svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Preischart">';
 for(let g=0;g<7;g++)s+='<line x1="0" x2="'+W+'" y1="'+(20+g*50)+'" y2="'+(20+g*50)+'" stroke="var(--line)" stroke-width=".6"/>';
 s+='<polyline fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round" points="'+R.pr.map((p,i)=>X(i)+','+Y(p)).join(' ')+'"/>';
 if(tl&&tl.length===6){ // Trendlinien eines Dreiecks: A-C-E-Seite und B-D-Seite, gestrichelt, bis kurz hinter E verlängert
  const end=tl[5]+1.5,ln=(a,b)=>{const x1=X(tl[a]),y1=Y(R.pr[tl[a]]),x2=X(tl[b]),y2=Y(R.pr[tl[b]]),xe=X(end);
   return '<line x1="'+x1+'" y1="'+y1+'" x2="'+xe+'" y2="'+(y1+(y2-y1)/(x2-x1)*(xe-x1))+'" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="5 4" opacity=".55"/>'};
  s+=ln(1,3)+ln(2,4);}
 const list=showPiv?R.piv.map((i,k)=>[i,k]):marks.map((i,k)=>[i,k]);
 list.forEach(([i,k])=>{const up=R.pr[i]>=(R.pr[i-1]??-1e9)&&R.pr[i]>=(R.pr[i+1]??-1e9);
  s+='<text class="lab" x="'+X(i)+'" y="'+(Y(R.pr[i])+(up?-7:15))+'">'+(R.lab?R.lab[k]:R.P.labels[k])+'</text>';});
 return s+'</svg>';
}

// ---- 4) Spiel
// Fortschritt (Punkte, Serie) bleibt lokal im Browser gespeichert, ohne Konto. Das Level ergibt sich aus den Punkten.
// Erlaubt der Browser kein Speichern (z. B. privates Fenster), läuft die App ohne Speichern normal weiter (try/catch).
const SAVE='waveChecker.progress';
const st=(()=>{try{const s=JSON.parse(localStorage.getItem(SAVE));
 if(s&&Number.isFinite(s.pts)&&Number.isFinite(s.streak))return{pts:Math.max(0,s.pts),streak:Math.max(0,s.streak)}}catch(_){}
 return{pts:0,streak:0}})();
const saveProgress=()=>{try{localStorage.setItem(SAVE,JSON.stringify({pts:st.pts,streak:st.streak}))}catch(_){}};
const $=q=>document.querySelector(q);
function stats(){saveProgress();const lv=Math.floor(st.pts/50)+1;$('#lv').textContent=lv;$('#pt').textContent=st.pts;$('#sr').textContent=st.streak;$('#pb').style.width=(st.pts%50)*2+'%';}
function home(){
 $('#view').innerHTML='<p class="mut">Du kannst alles frei wählen. Empfehlung für dein Level: <b>'+STUFENNAME[recStage()]+'</b>.</p><div class="card"><h2>Chart durchzählen</h2><p class="mut">Wähle das Muster, setze die Wellenpunkte auf den Chart und lass die Zählung prüfen.</p><button class="p" onclick="pick(\'count\')">Starten</button></div><div class="card"><h2>Fehler finden</h2><p class="mut">Ein Count ist vorgegeben und enthält einen Regelverstoß, bei Impuls, Zigzag und Flats auch in den Subwellen. Finde die Welle und die Regel.</p><button class="p" onclick="pick(\'find\')">Starten</button></div><div class="card"><h2>Muster erkennen</h2><p class="mut">Ein Chart ohne Beschriftung kommt zufällig. Erkenne, welches Muster es ist: normal per Auswahl oder schwer durch eigenes Zählen.</p><button class="p" onclick="recognize()">Starten</button></div><div class="card"><h2>Subwellen zählen</h2><p class="mut">Längerer Chart: Zähle erst die Hauptwellen, dann die Subwellen der einzelnen Wellen. Für alle Muster.</p><button class="p" onclick="pickSub()">Starten</button></div><p id="rs" style="text-align:center;margin-top:28px">'+RSBTN+'</p>';
}
// Fortschritt zurücksetzen: unauffälliger Button, Sicherheitsabfrage direkt auf der Seite (kein Browser-Popup)
const RSBTN='<button class="mut" style="border-color:var(--line);font-size:.85rem" onclick="resetAsk()">Fortschritt zurücksetzen</button>';
function resetAsk(){$('#rs').innerHTML='<span class="mut">Punkte, Level und Serie wirklich auf 0 setzen? Das lässt sich nicht rückgängig machen.</span><br><button onclick="resetDo()">Ja, zurücksetzen</button><button class="p" onclick="$(\'#rs\').innerHTML=RSBTN">Abbrechen</button>'}
function resetDo(){st.pts=0;st.streak=0;stats();$('#rs').innerHTML='<span class="mut">Fortschritt zurückgesetzt.</span>'}
// Schwierigkeitsstufen sind nur eine Empfehlung: Jeder darf alles frei wählen. Die empfohlene Stufe folgt dem Level (alle 50 Punkte).
// Stufe 1: Impuls, Zigzag. Stufe 2: Flats, Dreiecke, Diagonalen. Stufe 3: Subwellen zählen. Stufe 4: Double Zigzag, Dreifache Form.
const STUFEN=[[1,'Stufe 1 · Einsteiger',[['imp','Impuls'],['zig','Zigzag']]],
 [2,'Stufe 2 · Fortgeschritten',[['fr','Regular Flat'],['fe','Expanded Flat'],['fru','Running Flat'],['trk','Kontrahierendes Dreieck'],['tre','Expandierendes Dreieck'],['dl','Leading Diagonale'],['db','Beendende Diagonale'],['de','Expandierende Diagonale']]],
 [4,'Stufe 4 · Profi',[['dz','Double Zigzag'],['tz','Dreifache Form']]]];
const recStage=()=>{const lv=Math.floor(st.pts/50)+1;return lv<2?1:lv<4?2:lv<6?3:4};
const STUFENNAME={1:'Stufe 1 (Impuls, Zigzag)',2:'Stufe 2 (Flats, Dreiecke, Diagonalen)',3:'Stufe 3 (Subwellen zählen)',4:'Stufe 4 (Double Zigzag, Dreifache Form)'};
// Musterwahl, gruppiert nach Stufe; die empfohlene Stufe ist markiert
function pick(mode){
 const rec=recStage();
 $('#view').innerHTML='<div class="card"><h2>'+(mode==='count'?'Chart durchzählen':mode==='sub'?'Subwellen zählen':'Fehler finden')+'</h2><p><b>Muster wählen</b></p>'+
  STUFEN.map(([n,t,items])=>'<p class="mut" style="margin:10px 0 0">'+t+(n===rec?' · <b>Empfohlen</b>':'')+'</p>'+items.map(([k,l])=>'<button class="p" onclick="go(\''+mode+'\',\''+k+'\')">'+l+'</button>').join('')).join('')+
  '<p><button onclick="home()">Zurück</button></p></div>';
}
function go(mode,key){mode==='count'?count(PAT[key]):mode==='sub'?sub(key):SUBOK.includes(key)?findSub(key):find(PAT[key])}
// Hauptmenü-Button: erscheint, sobald ein Modus gestartet wird (pick, recognize, pickSub), und verschwindet im Hauptmenü
['pick','recognize','pickSub'].forEach(n=>{const f=window[n];window[n]=function(){$('#menu').hidden=false;return f.apply(this,arguments)}});
{const h0=home;window.home=function(){$('#menu').hidden=true;window.scrollTo(0,0);return h0()}}
$('#menu').onclick=()=>home();
$('#home').onclick=()=>home();$('#home').onkeydown=e=>{if(e.key==='Enter')home()};

// Punkte setzen und verschieben (Maus oder Finger), gemeinsam für „Chart durchzählen“ und „Muster erkennen – Schwer“.
// Antippen in der Nähe eines gesetzten Punktes greift ihn, sonst wird ein neuer Punkt gesetzt. pic() liefert das SVG mit den aktuellen Punkten.
function bindPoints(m,n,pic,render){
 const svg=$('#svg'),xAt=ev=>{const r=$('#svg').getBoundingClientRect();return (ev.clientX-r.left)/r.width*W};
 const idxOf=x=>Math.max(0,Math.min(45,Math.round((x-X0)/DX)));
 svg.style.touchAction='none';
 svg.onpointerdown=e=>{if(m.done)return;e.preventDefault();
  const f=(xAt(e)-X0)/DX;let k=-1,best=1.2;
  m.sel.forEach((i,j)=>{if(Math.abs(f-i)<=best){best=Math.abs(f-i);k=j}});
  if(k>=0){ // gesetzten Punkt verschieben, er bleibt zwischen seinen Nachbarpunkten
   const mv=ev=>{const lo=k>0?m.sel[k-1]+1:0,hi=k<m.sel.length-1?m.sel[k+1]-1:45,nw=Math.max(lo,Math.min(hi,idxOf(xAt(ev))));
    if(nw!==m.sel[k]){m.sel[k]=nw;redraw(svg,pic());}};
   startDrag(svg,e,mv,()=>render());
  }else if(m.sel.length<n){
   const i=idxOf(xAt(e));
   if(m.sel.length&&i<=m.sel[m.sel.length-1])return render('<span class="warn">Der Punkt muss rechts vom vorherigen liegen.</span>');
   m.sel.push(i);render();
  }};
}
// Modus 1: Chart durchzählen
function count(P){
 const R=makeRound(P,null),n=P.labels.length,m={sel:[],tips:0,failed:false,done:false};
 const render=(fb)=>{
  $('#view').innerHTML='<p class="mut">'+P.title+': Tippe nacheinander die Punkte '+P.labels.join(', ')+' auf den Chart. Gesetzte Punkte kannst du anfassen und verschieben. Nächster Punkt: <b>'+(m.sel.length<n?P.labels[m.sel.length]:'fertig')+'</b></p><div class="chart">'+draw(R,m.sel,false,m.tl&&P.tri?m.sel:null)+'</div>'+(m.tl&&P.tri?'<p class="mut">Gestrichelt: Trendlinien durch '+(P.waves[0]==='A'?'A, C (bis E) und durch B, D.':'die Enden der Wellen 1, 3 (bis 5) und der Wellen 2, 4.')+'</p>':'')+'<div>'+
  '<button class="p" id="chk" '+(m.sel.length<n||m.done?'disabled':'')+'>Prüfen</button><button id="und" '+(m.done?'disabled':'')+'>Zurück</button><button id="rst" '+(m.done?'disabled':'')+'>Neu setzen</button></div><div class="card" id="fb" '+(fb?'':'hidden')+'>'+(fb||'')+'</div>';
  bindPoints(m,n,()=>draw(R,m.sel,false,m.tl&&P.tri?m.sel:null),render);
  $('#und').onclick=()=>{m.sel.pop();render()};$('#rst').onclick=()=>{m.sel=[];render()};
  $('#chk').onclick=verify;
 };
 const fail=html=>{m.failed=true;if(st.streak)st.streak=0,stats();return html};
 const verify=()=>{
  m.tl=true; // Trendlinien (nur Dreiecke) erscheinen ab dem ersten Prüfen
  // Platzierung und Richtung sind App-Vorgaben (keine Regelwerk-Regeln) und werden vor den Regeln geprüft.
  // Jeder Wendepunkt muss am echten Extrem sitzen (Toleranz TOL Kerzen), sonst ergibt die Zählung keinen Sinn (z. B. A zu früh gesetzt).
  const bad=m.sel.findIndex((i,k)=>k>0&&Math.abs(i-R.piv[k])>TOL);
  if(bad===n-1)return render(fail('<p class="bad">Noch nicht ganz.</p><p>'+P.endMsg+'</p>'));
  if(bad>0)return render(fail('<p class="bad">Noch nicht ganz.</p><p>Punkt '+P.labels[bad]+' sitzt nicht am relevanten Wendepunkt. Setze ihn an das Hoch bzw. Tief, wo die Bewegung wirklich dreht, nicht an eine kleinere Zwischenspitze.</p>'));
  const v=norm(P,m.sel.map(i=>R.pr[i]));
  if(P.struct&&!P.struct(v))return render(fail('<p class="bad">Noch nicht ganz.</p><p>'+P.structMsg+'</p>'));
  const f=hardFails(P,v);
  if(f.length){fail();return tipUI(f)}
  m.done=true;const gain=Math.max(4,10-3*m.tips)-(m.failed?2:0);
  if(!m.failed)st.streak++;st.pts+=gain;stats();
  const w=warns(P,v).map(id=>'<p class="warn">'+(P.rules[id].lvl==='o'?'Hinweis':'Warnung')+' ('+tag(P,id)+'): '+P.rules[id].ex+'</p>').join('');
  render('<p class="ok">Regelkonform! +'+gain+' Punkte</p><p class="mut">Die App prüft die Regeln. Die Wendepunkte müssen dafür an den echten Extremen sitzen.</p>'+w+P.info(v)+'<button class="p" id="nxt">Nächster Chart</button>');
  $('#nxt').onclick=()=>count(P);
 };
 const tipUI=f=>{const r=P.rules[f[0]];
  const lines=['Die Zählung ist noch nicht regelkonform.'];
  if(m.tips>=1)lines.push('Tipp 1: '+r.hint);
  if(m.tips>=2)lines.push('Tipp 2: Es geht um die Regel „'+r.name+'“.');
  if(m.tips>=3)lines.push('Tipp 3: '+tag(P,f[0])+'. '+r.ex);
  render('<p class="bad">Noch nicht ganz.</p>'+lines.map(t=>'<p>'+t+'</p>').join('')+(m.tips<3?'<button id="tip">Tipp anzeigen</button>':''));
  const t=$('#tip');if(t)t.onclick=()=>{m.tips++;tipUI(f)};
 };
 render();
}

// Modus 2: Fehler finden
function find(P){
 const id=P.viol[Math.floor(Math.random()*P.viol.length)],R=makeRound(P,id,true),m={w:null,r:P.viol.length===1?id:null},rule=P.rules[id],wv=R.vwave||rule.wave;
 const render=(fb)=>{
  $('#view').innerHTML='<p class="mut">'+P.title+': Dieser Count enthält genau einen Regelverstoß. Wähle die fehlerhafte Welle und die verletzte Regel.</p><div class="chart">'+draw(R,[],true)+'</div>'+
  '<div class="card"><b>Welche Welle?</b><br>'+P.waves.map(w=>'<button data-w="'+w+'" class="'+(m.w===w?'on':'')+'">Welle '+w+'</button>').join('')+
  (P.viol.length>1&&m.w?'<br><b>Welche Regel?</b><br>'+P.viol.map(x=>'<button data-r="'+x+'" class="'+(m.r===x?'on':'')+'">'+P.rules[x].name+'</button>').join(''):'')+
  '<br><button class="p" id="go" '+(m.w&&m.r&&!fb?'':'disabled')+'>Auswerten</button><button id="dk" '+(fb?'disabled':'')+'>Ich weiß nicht</button></div><div class="card" id="fb" '+(fb?'':'hidden')+'>'+(fb||'')+'</div>';
  if(fb)return;
  document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{m.w=b.dataset.w;render()});
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{m.r=b.dataset.r;render()});
  $('#dk').onclick=()=>{render('<p class="mut">Kein Problem, hier die Auflösung (keine Punkte, deine Serie bleibt).</p><p>Gesucht war: Welle '+wv+', Regel „'+rule.name+'“ ('+tag(P,id)+'). '+rule.ex+'</p><button class="p" id="nxt">Nächster Chart</button>');$('#nxt').onclick=()=>find(P);};
  $('#go').onclick=()=>{const wOk=m.w===wv||!!(R.alt&&R.alt.includes(m.w)),rOk=m.r===id;
   if(wOk&&rOk){st.streak++;st.pts+=10}else st.streak=0;stats();
   render('<p class="'+(wOk&&rOk?'ok':'bad')+'">'+(wOk&&rOk?'Richtig! +10 Punkte':wOk?'Die Welle stimmt, die Regel nicht.':rOk?'Die Regel stimmt, die Welle nicht.':'Leider daneben.')+'</p><p>Gesucht war: Welle '+(R.alt?R.alt.join(' oder '):wv)+', Regel „'+rule.name+'“ ('+tag(P,id)+'). '+rule.ex+'</p><button class="p" id="nxt">Nächster Chart</button>');
   $('#nxt').onclick=()=>find(P);};
 };
 render();
}
// Modus 3: Muster erkennen – zufälliges Muster, ohne Beschriftung im Chart.
// Richtig ist jedes Muster, zu dem der Chart regelkonform ist (Entscheidung Lenny 21.10.2026), nicht nur das generierte.
const fmtSub=s=>s.split('').join('-');
// Passt der Chart R regelkonform zum Muster Q? Liefert null (passt) oder den Grund in Worten für den Nutzer (ohne Regel-IDs).
// Geprüft werden: gleiche Punktanzahl, Richtung/Struktur, alle HARTEN Regeln von Q an den Wendepunkten, Teilstruktur (subs).
function misfit(Q,R){
 const sel='beim Muster „'+Q.title+'“';
 if(Q.labels.length!==R.piv.length)return 'Der Chart hat '+(R.piv.length-1)+' Wellen, '+sel+' sind es '+(Q.labels.length-1)+'.';
 const v=norm(Q,R.piv.map(i=>R.pr[i]));
 if(Q.struct&&!Q.struct(v))return 'Die Richtung der Wellen passt nicht '+sel+'.';
 const f=hardFails(Q,v);
 if(f.length)return 'Verletzte Regel '+sel+': '+f.map(id=>'„'+Q.rules[id].name+'“ ('+tag(Q,id)+')').join(', ')+'.';
 if(!Q.subs.includes(R.P.subs[0]))return 'Die Teilwellen passen nicht: Hier sind sie '+fmtSub(R.P.subs[0])+' aufgebaut, '+sel+' '+Q.subs.map(fmtSub).join(' oder ')+'.';
 return null;
}
// Ein Satz, woran man zwei auf dem Chart gleich regelkonforme Muster unterscheidet
const diffMsg=(P,Q)=>P.ctx&&Q.ctx?'Unterschied: Auf dem Chart allein passen beide, entscheidend ist die Stelle im größeren Trend ('+P.title+': '+P.ctx+'; '+Q.title+': '+Q.ctx+').':'Unterschied: Vergleiche die beiden Beschreibungen unten.';
// Muster erkennen: zuerst den Schwierigkeitsgrad wählen
function recognize(){
 $('#view').innerHTML='<div class="card"><h2>Muster erkennen</h2><p class="mut">Wähle den Schwierigkeitsgrad.</p>'+
  '<p><button class="p" onclick="recogNormal()">Normal</button><br><span class="mut">Das Muster aus einer Liste wählen (+10 Punkte).</span></p>'+
  '<p><button class="p" onclick="recogHard()">Schwer: Chart selbst zählen</button><br><span class="mut">Zählweise wählen, Punkte setzen, dann das genaue Muster bestimmen (+20 Punkte, Bonus +10).</span></p>'+
  '<p><button onclick="home()">Zurück</button></p></div>';
}
function recogNormal(){
 const keys=Object.keys(PAT).filter(k=>!PAT[k].noRecog),P=PAT[keys[Math.floor(Math.random()*keys.length)]],R=makeRound(P,null),m={sel:null};
 const render=(fb)=>{
  $('#view').innerHTML='<p class="mut">Welches Muster zeigt dieser Chart? Schau dir die Teilbewegungen und die Lage der Wendepunkte an.</p><div class="chart">'+draw(R,[],!!fb,fb&&P.tri?R.piv:null)+'</div>'+(fb&&P.tri?'<p class="mut">Gestrichelt: die Trendlinien des Musters.</p>':'')+
  '<div class="card"><b>Muster</b><br>'+keys.map(k=>'<button data-k="'+k+'" class="'+(m.sel===k?'on':'')+'" '+(fb?'disabled':'')+'>'+PAT[k].title+'</button>').join('')+
  '</div><div class="dock">'+(fb?fb.v+'<button class="p" id="nxt">Nächster Chart</button>':'<button class="p" id="go" '+(m.sel?'':'disabled')+'>Antworten</button>')+'</div>'+(fb?'<div class="card" id="fb">'+fb.d+'</div>':'');
  if(fb)return;
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{m.sel=b.dataset.k;render()});
  $('#go').onclick=()=>{const Q=PAT[m.sel],same=m.sel===P.key,why=same?null:misfit(Q,R),ok=!why;
   if(ok){st.streak++;st.pts+=10}else st.streak=0;stats();
   render({v:same?'<p class="ok">Richtig! +10 Punkte</p>':ok?'<p class="ok">Richtig, auch regelkonform! +10 Punkte. Generiert wurde: '+P.title+'.</p>':'<p class="bad">Nicht ganz. Das war ein '+P.title+'.</p>',
    d:(same?'':'<p>'+(ok?diffMsg(P,Q):why)+'</p>')+'<p>'+P.recog+'</p>'+(same?'':'<p class="mut">Deine Wahl war: '+Q.recog+'</p>')});
   $('#nxt').onclick=recogNormal;};
 };
 render();

// Muster erkennen – Schwer: Chart selbst zählen. Erst die Zählweise wählen, dann Punkte setzen wie in „Chart durchzählen“.

// Modus 4: Subwellen zählen. Längerer Chart; erst die Hauptpunkte, dann die Subwellen der Wellen einzeln.
// Impuls: Subwellen von Welle 1, 3, 5 (je 5-teilig). Zigzag: A (5), B (3), C (5). Flats: A (3), B (3), C (5).
// Fünfteilige Wellen sind selbst Impulse (W1-1, WA-1, WC-1): dafür gelten IMP-1 bis IMP-4. Dreiteilige Wellen: nur die App-Vorgabe zur Richtung,

function pickAlt(violate){
 const pk=a=>a[Math.floor(Math.random()*a.length)],A2=['Zigzag','Flat','Double Zigzag'],A4=A2.concat('Dreieck');
 if(violate==='W4-3'){const x=pk(A2);return{2:x,4:x}}
 if(violate==='DRE-1')return{2:'Dreieck',4:pk(A2)};

  const nm=legNames&&legNames[k],fr=sp0?(sp0.parts===3?abcF():sp0.viol?(()=>{const g=genImp(sp0.viol);return g.map(q=>q/g[5])})():impF()):nm?(nm==='Dreieck'?triF():abcF()):isTri?triF():frs[k-1]();

function drawS(R,pts,band){

function pickSub(){pick('sub')} // gleiche Musterliste wie bei den anderen Modi
function sub(key){

  m.done=true;const gain=Math.max(2,5-2*m.tips);m.gain+=gain;st.pts+=gain;stats();
  const last=m.s===stages.length-1;
  const done=(main?'Hauptwellen':'Subwellen von Welle '+g.nm)+' regelkonform! +'+gain+' Punkte';
  if(last&&!m.failed){st.streak++;stats();}
  m.fixed=m.fixed.concat(m.sel.map((i,k)=>({i,l:g.labels[k],sub:!main})));
  render('<p class="ok">'+done+'</p>'+w+(last?'<p class="mut">Runde geschafft: '+m.gain+' Punkte.</p>':'')+'<button class="p" id="nxt">'+(last?'Nächster Chart':'Weiter')+'</button>');
  $('#nxt').onclick=()=>{if(last)return sub(P.key);m.s++;m.sel=[];m.tips=0;m.done=false;render();};
 };
 render();
}

// Modus 5 (Fehler finden für Impuls, Zigzag und Flats): Alle Haupt- und Subpunkte sind beschriftet, genau ein Verstoß steckt im Count.
// Der Fehler liegt entweder auf Hauptebene (Regeln des Musters) oder in der Teilstruktur einer Welle: falsche Teilzahl (5 statt 3 oder umgekehrt)
// oder eine fünfteilige Welle verletzt IMP-1 bis IMP-3 in ihren Subwellen. Nach der Wahl der Welle zeigt die App nur die Regeln, die diese Welle betreffen.
const SUBOK=Object.keys(PAT); // alle Muster haben einen Subwellen-Aufbau
function findSub(key){
 const P=PAT[key],IM=PAT.imp,sub5=['IMP-1','IMP-2','IMP-3'],imp=key==='imp';
 const SR={}; // alle möglichen Regeln: Hauptebene unter der Regel-ID, Teilstruktur mit Präfix „s:“
 P.viol.forEach(id=>SR[id]=P.rules[id]);
 if(key==='imp'){ // Alternation und Dreieck in Welle 2 (nur Impuls)
  SR['W4-3']={where:'Regelwerk, Abschnitt Welle 4',name:'Welle 2 und Welle 4 bilden dasselbe Korrekturmuster aus',hint:'Vergleiche die Muster, die an Welle 2 und Welle 4 stehen.',ex:'Alternation: Welle 4 muss ein anderes Korrekturmuster ausbilden als Welle 2 derselben Wellenebene.'};
  SR['DRE-1']={page:50,name:'Dreieck in Welle 2',hint:'Schau, welches Muster an Welle 2 steht. Gibt es ein Muster, das dort nie vorkommt?',ex:'Dreiecke treten niemals in Welle 2, C und W auf.'};}
 sub5.forEach(id=>SR['s:'+id]={...IM.rules[id],name:'Subwellen: '+IM.rules[id].name});
 Object.assign(SR,{
  's:IMP-4':{page:38,name:'Eine Impulswelle (1, 3 oder 5) ist nicht fünfteilig',hint:'Zähle die Subwellen der Wellen 1, 3 und 5.',ex:'Welle 1, 3 und 5 verlaufen in Trendrichtung und sind impulsiv (5-teilig).'},
  's:ZZ-1':{page:42,name:'Welle A oder C ist nicht fünfteilig',hint:'Zähle die Subwellen von A und C.',ex:'Die Wellen A und C werden impulsiv fünfteilig gebildet.'},
  's:ZZ-2':{page:42,name:'Welle B ist nicht dreiteilig',hint:'Zähle die Subwellen von Welle B.',ex:'Welle B besteht aus 3 Subwellen.'},
  's:FL-A':{page:46,name:'Welle A ist nicht dreiteilig',hint:'Zähle die Subwellen von Welle A.',ex:'Bei jeder Flat ist Welle A dreiteilig.'},
  's:WB-2':{where:'Regelwerk, Abschnitt Welle B',name:'Welle B ist nicht dreiteilig',hint:'Zähle die Subwellen von Welle B.',ex:'In Flats ist Welle B dreiteilig korrektiv.'},
  's:DRE-4':{page:50,name:'Eine Dreieckswelle ist nicht dreiteilig',hint:'Zähle die Subwellen jeder Welle des Dreiecks.',ex:'Ein Dreieck hat 5 Wellen (A-B-C-D-E), die jeweils dreiteilig ausgebildet werden.'},
  's:DL-2':{where:'Regelwerk, Abschnitt Diagonale',name:'Teilstruktur passt nicht zu 5-3-5-3-5 oder 3-3-3-3-3',hint:'Zähle die Subwellen aller fünf Wellen und vergleiche sie mit den erlaubten Mustern.',ex:'Die Leading Diagonale ist fünfteilig und bildet ein 5-3-5-3-5- oder ein 3-3-3-3-3-Muster.'},
  's:DB-2':{where:'Regelwerk, Abschnitt Diagonale',name:'Eine Welle der Diagonale ist nicht dreiteilig',hint:'Zähle die Subwellen aller fünf Wellen.',ex:'Die Beendende Diagonale bildet ein 3-3-3-3-3-Muster.'},
  's:DE-2':{where:'Regelwerk, Abschnitt Diagonale',name:'Eine Welle der Diagonale ist nicht dreiteilig',hint:'Zähle die Subwellen aller fünf Wellen.',ex:'Bei der Expandierenden Diagonale muss stets ein 3-3-3-3-3-Muster vorliegen.'},
  's:WC-2':{where:'Regelwerk, Abschnitt Welle C',name:'Welle C ist nicht fünfteilig',hint:'Zähle die Subwellen von Welle C.',ex:'In Flats ist Welle C ein klassischer Fünfteiler (oder eine Ending Diagonale).'}});
 // Optionen: {id, wave, plan}; plan = Umbau der Teilstruktur einer Welle (nur bei Subwellen-Fehlern)
 const opts=[],dyn=id=>key==='trk'||key==='tre'||id==='DE-3'; // bei diesen Regeln hängt die fehlerhafte Welle von der Runde ab
 const mainOpts=P.viol.map(id=>({id,wave:dyn(id)?'*':P.rules[id].wave,main:true}));
 if(key==='imp')mainOpts.push({id:'W4-3',wave:'4',alt:['2','4'],main:true},{id:'DRE-1',wave:'2',main:true});
 // Überlappung (IMP-3) ist nur dort ein Fehler, wo keine Diagonale möglich ist: Impuls Welle 3 (W3-1), Zigzag-A (ZZ-1). In Welle 1, 5 und C kann es eine Diagonale sein.
 const ok5=(id,k)=>id!=='IMP-3'||(imp&&k===3)||(key==='zig'&&k===1);
 const add=(id,k,plan)=>opts.push({id,wave:P.waves[k-1],k,plan});
 if(imp){for(const k of [1,3,5]){add('s:IMP-4',k,{parts:3});sub5.filter(id=>ok5(id,k)).forEach(id=>add('s:'+id,k,{parts:5,viol:id}))}}
 else if(key==='zig'){for(const k of [1,3]){add('s:ZZ-1',k,{parts:3});sub5.filter(id=>ok5(id,k)).forEach(id=>add('s:'+id,k,{parts:5,viol:id}))}add('s:ZZ-2',2,{parts:5})}
 else if(key==='fr'||key==='fe'||key==='fru'){add('s:FL-A',1,{parts:5});add('s:WB-2',2,{parts:5});add('s:WC-2',3,{parts:3});sub5.filter(id=>ok5(id,3)).forEach(id=>add('s:'+id,3,{parts:5,viol:id}))}
 else if(key==='trk'||key==='tre'){for(let k=1;k<=5;k++)add('s:DRE-4',k,{parts:5})} // jede Dreieckswelle ist dreiteilig
 else if(key==='dl'){for(let k=1;k<=5;k++)add('s:DL-2',k,{parts:k%2?3:5})} // 5-3-5-3-5 oder 3-3-3-3-3: eine abweichende Welle bricht das Muster
 else if(key==='db')for(let k=1;k<=5;k++)add('s:DB-2',k,{parts:5})
 else if(key==='de')for(let k=1;k<=5;k++)add('s:DE-2',k,{parts:5})
 // dz und tz: nur Hauptebene (Dehnung von X, Dreieck in W); die Muster der Teile stehen im Chart
 const all=mainOpts.concat(opts).concat(key==='imp'?[{id:'W4-3',wave:'2'}]:[]),pickFrom=a=>a[Math.floor(Math.random()*a.length)];
 const o=(!opts.length||Math.random()<.4)?pickFrom(mainOpts):pickFrom(opts),id=o.id;
 const R=o.main?makeSubRound(P,{},id,true):makeSubRound(P,{[o.k]:o.plan},null,true),m={w:null,r:null},wv=o.main?(R.vwave||o.wave):o.wave,alt=o.alt||null; // alt: gleichwertige Wellen (Alternation: 2 oder 4)
 // Beschriftung: alle Hauptpunkte (weiter außen) und alle Subpunkte jeder Welle, einschließlich des letzten ((5) bzw. (c))
 const pts=R.mp.map((i,q)=>({i,l:R.lab?R.lab[q]:P.labels[q],far:true}));
 Object.keys(R.spAll).forEach(q=>{const t=R.spAll[q],lab=t.length===5?(R.tri[q]?['(a)','(b)','(c)','(d)','(e)']:['(1)','(2)','(3)','(4)','(5)']):['(a)','(b)','(c)'];t.forEach((i,j)=>pts.push({i,l:lab[j],sub:true}))});
 const solution=()=>'Gesucht war: Welle '+(alt?alt.join(' oder '):wv)+', Regel „'+SR[id].name+'“ ('+tag({rules:SR},id)+'). '+SR[id].ex;
 const render=fb=>{
  const rl=m.w?[...new Set(all.filter(x=>x.wave===m.w||x.wave==='*').map(x=>x.id))]:[];
  $('#view').innerHTML='<p class="mut">'+P.title+': Dieser Count enthält genau einen Regelverstoß, auf Hauptebene oder in den Subwellen. Wähle die fehlerhafte Welle und die verletzte Regel.</p><div class="chart">'+drawS(R,pts,null)+'</div>'+
   '<div class="card"><b>Welche Welle?</b><br>'+P.waves.map(w=>'<button data-w="'+w+'" class="'+(m.w===w?'on':'')+'">Welle '+w+'</button>').join('')+
   (m.w?'<br><b>Welche Regel?</b> <span class="mut">(Regeln zu Welle '+m.w+' und ihren Subwellen)</span><br>'+(rl.length?rl.map(x=>'<button data-r="'+x+'" class="'+(m.r===x?'on':'')+'">'+SR[x].name+'</button>').join(''):'<span class="mut">Zu dieser Welle gibt es in diesem Muster keinen Regelverstoß.</span>'):'<br><span class="mut">Klicke zuerst die Welle an, in der du den Fehler vermutest. Danach siehst du die Regeln zur Auswahl.</span>')+
   '<br><button class="p" id="go" '+(m.w&&m.r&&!fb?'':'disabled')+'>Auswerten</button><button id="dk" '+(fb?'disabled':'')+'>Ich weiß nicht</button></div><div class="card" id="fb" '+(fb?'':'hidden')+'>'+(fb||'')+'</div>';
  if(fb)return;
  document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{m.w=b.dataset.w;if(!all.some(x=>(x.wave===m.w||x.wave==='*')&&x.id===m.r))m.r=null;render()});
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{m.r=b.dataset.r;render()});
  $('#dk').onclick=()=>{render('<p class="mut">Kein Problem, hier die Auflösung (keine Punkte, deine Serie bleibt).</p><p>'+solution()+'</p><button class="p" id="nxt">Nächster Chart</button>');$('#nxt').onclick=()=>findSub(key);};
  $('#go').onclick=()=>{const wOk=m.w===wv||!!(alt&&alt.includes(m.w)),rOk=m.r===id,ok=wOk&&rOk;
   if(ok){st.streak++;st.pts+=10}else st.streak=0;stats();
   render('<p class="'+(ok?'ok':'bad')+'">'+(ok?'Richtig! +10 Punkte':wOk?'Die Welle stimmt, die Regel nicht.':rOk?'Die Regel stimmt, die Welle nicht.':'Leider daneben.')+'</p><p>'+solution()+'</p><button class="p" id="nxt">Nächster Chart</button>');
   $('#nxt').onclick=()=>findSub(key);};
 };
 render();
}
// ---- 5) Lernbereich: zeigt lernen/regelwerk-lernversion.md (die menschenlesbare Fassung des Regelwerks) 1:1 als Seite.
// Die Markdown-Datei ist die Quelle: Text nur dort ändern, die Seite liest sie bei jedem Öffnen neu.
// Unterstützt wird genau das, was die Datei nutzt: Überschriften, Absätze, fett/kursiv, Listen, Tabellen,
// Bilder mit kursiver Bildunterschrift in der Zeile darunter.
const LMD='lernen/regelwerk-lernversion.md';
// „Jetzt üben“ am Ende eines Kapitels: Anfang der Kapitelüberschrift (klein geschrieben) → Muster für „Chart durchzählen“
const UEBEN=[['der impuls',['imp']],['das zigzag',['zig']],['die flats',['fr','fe','fru']],['dreiecke',['trk','tre']],['diagonalen',['dl','db','de']],['komplexe korrekturen',['dz','tz']]];
let LEARN=null; // gemerkte Ansicht (DOM-Knoten, Hauptmenü-Button, Scrollposition), zu der „Zurück“ führt
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
function mdToHtml(md){
 const L=md.replace(/\r/g,'').split('\n'),out=[],toc=[];let i=0,chap=null,title='';
 const ueben=()=>{const e=chap&&UEBEN.find(([p])=>chap.toLowerCase().startsWith(p));
  if(e)out.push('<p class="ueben">'+e[1].map(k=>'<button class="p" data-ueben="'+k+'" data-kap="lk-'+toc.length+'">Jetzt üben'+(e[1].length>1?': '+PAT[k].title:'')+'</button>').join('')+'</p>')};
 const isBlock=l=>/^(#{1,3} |\||!\[|- |\d+\. )/.test(l);
 while(i<L.length){const l=L[i];
  if(!l.trim()){i++;continue}
  const h=l.match(/^(#{1,3}) (.*)/);
  if(h){i++;
   if(h[1].length===2){ueben();chap=h[2];toc.push(h[2]);out.push('<h2 id="lk-'+toc.length+'">'+inl(h[2])+'</h2>')}
   else if(h[1].length===1)title='<h1>'+inl(h[2])+'</h1>'; // Titel steht über dem Inhaltsverzeichnis
   else out.push('<h3>'+inl(h[2])+'</h3>');
   continue}
  if(l.startsWith('|')){const rows=[],cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
   while(i<L.length&&L[i].startsWith('|'))rows.push(L[i++]);
   out.push('<table><thead><tr>'+cells(rows[0]).map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead><tbody>'+
    rows.slice(2).map(r=>'<tr>'+cells(r).map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>');continue}
  const im=l.match(/^!\[(.*?)\]\((.*?)\)\s*$/);
  if(im){i++;while(i<L.length&&!L[i].trim())i++;
   const c=i<L.length&&L[i].match(/^\*(.+)\*\s*$/);if(c)i++; // Bildunterschrift (z. B. „Chart erstellt mit TradingView“) gehört direkt unter das Bild
   out.push('<figure><img src="lernen/'+esc(im[2])+'" alt="'+esc(im[1])+'" loading="lazy">'+(c?'<figcaption>'+inl(c[1])+'</figcaption>':'')+'</figure>');continue}
  if(/^- /.test(l)||/^\d+\. /.test(l)){const ol=/^\d/.test(l),re=ol?/^\d+\. /:/^- /,it=[];
   while(i<L.length&&re.test(L[i]))it.push(L[i++].replace(re,''));
   out.push('<'+(ol?'ol':'ul')+'>'+it.map(x=>'<li>'+inl(x)+'</li>').join('')+'</'+(ol?'ol':'ul')+'>');continue}
  const p=[];do p.push(L[i++]);while(i<L.length&&L[i].trim()&&!isBlock(L[i]));out.push('<p>'+inl(p.join(' '))+'</p>');
 }
 ueben();
 return{html:out.join(''),toc,title};
}
async function learn(kap){ // kap: Kapitel (lk-…), zu dem gesprungen wird
 if(LEARN){const k=kap&&$('#'+kap);return k?k.scrollIntoView():window.scrollTo(0,0)} // schon auf der Lernseite
 const v=$('#view'),f=document.createDocumentFragment();
 LEARN={f,menu:$('#menu').hidden,tolearn:$('#tolearn').hidden,y:window.scrollY};
 while(v.firstChild)f.appendChild(v.firstChild); // laufenden Modus samt Zustand aufheben, nicht neu starten
 $('#menu').hidden=$('#tolearn').hidden=true;v.innerHTML='<p class="mut">Lädt …</p>';window.scrollTo(0,0);
 let md;
 try{const r=await fetch(LMD,{cache:'no-cache'});if(!r.ok)throw new Error(r.status);md=await r.text()}
 catch(_){if(LEARN)v.innerHTML='<div class="card"><p class="bad">Die Lernseite konnte nicht geladen werden.</p><button class="p" onclick="learnBack()">← Zurück</button></div>';return}
 if(!LEARN)return; // inzwischen woandershin gewechselt
 const {html,toc,title}=mdToHtml(md);
 v.innerHTML='<div class="learn"><button onclick="learnBack()">← Zurück</button>'+title+'<nav class="card toc"><b>Inhalt</b><ol>'+
  toc.map((t,j)=>'<li><a href="#lk-'+(j+1)+'" data-j="'+(j+1)+'">'+inl(t)+'</a></li>').join('')+'</ol></nav>'+html+
  '<p><button onclick="learnBack()">← Zurück</button></p></div>';
 v.querySelectorAll('[data-j]').forEach(a=>a.onclick=e=>{e.preventDefault();$('#lk-'+a.dataset.j).scrollIntoView({behavior:'smooth'})});
 v.querySelectorAll('.learn figure img').forEach(im=>im.onclick=()=>zoom(im));
 const k=kap&&$('#'+kap);if(k)k.scrollIntoView(); // direkt zum Kapitel des Musters, von dem man kam
 v.querySelectorAll('[data-ueben]').forEach(b=>b.onclick=()=>{LEARN=null;$('#menu').hidden=false;$('#tolearn').hidden=false;$('#tolearn').dataset.kap=b.dataset.kap;window.scrollTo(0,0);count(PAT[b.dataset.ueben])});
}
// Zurück dorthin, wo man vorher war (gemerkte Ansicht wieder einsetzen)
function learnBack(){const s=LEARN;LEARN=null;closeZoom();
 if(!s)return home();
 const v=$('#view');v.innerHTML='';v.appendChild(s.f);$('#menu').hidden=s.menu;$('#tolearn').hidden=s.tolearn;window.scrollTo(0,s.y);}
// Bild vergrößern: Vollbild mit Bildunterschrift, Tippen oder Escape schließt
function zoom(im){const fc=im.parentNode.querySelector('figcaption'),d=document.createElement('div');d.className='lb';d.id='lb';
 d.innerHTML='<img src="'+esc(im.getAttribute('src'))+'" alt="'+esc(im.alt)+'">'+(fc?'<p>'+fc.innerHTML+'</p>':'')+'<p>Tippen zum Schließen</p>';
 d.onclick=closeZoom;document.body.appendChild(d);}
function closeZoom(){const d=$('#lb');if(d)d.remove()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeZoom()});
$('#learn').onclick=()=>learn();
// „← Zurück zum Regelwerk“: nur sichtbar, wenn man über „Jetzt üben“ in „Chart durchzählen“ gekommen ist
$('#tolearn').onclick=()=>learn($('#tolearn').dataset.kap);
{const h1=window.home;window.home=function(){LEARN=null;$('#tolearn').hidden=true;return h1.apply(this,arguments)}} // Hauptmenü verlässt Lernseite und „Jetzt üben“ endgültig
stats();home();
</script>
