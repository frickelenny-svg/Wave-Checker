<script>/* gewähltes Design (hell/dunkel) sofort setzen, damit nichts aufblitzt */try{const t=localStorage.getItem("waveChecker.theme");if(t)document.documentElement.dataset.theme=t}catch(_){}</script>
<style>
/* ===== Design laut DESIGN.md (Palette K „Blau & Weiß hell“). Farben NUR hier ändern. ===== */
:root{
 --bg:#EAF1FF;--surface:#FFFFFF;--text:#0B1B3A;--muted:#44557A;--accent:#1E5EFF;--accent-dark:#1238C9;--accent-text:#1E5EFF;--surface-hover:#F3F7FF;--daily-hover:#1238C9;
 --line:rgba(30,94,255,.35);--line-soft:rgba(30,94,255,.20);--chip:rgba(11,27,58,.07);--accent-soft:rgba(30,94,255,.12);
 --ok:#0E8A5F;--bad:#C2410C;--shadow:0 10px 30px rgba(30,60,140,.12);
 /* Regelstufen */
 --warn-bg:#FFE9D6;--warn-text:#8A3800;--warn-line:rgba(184,74,0,.35);--faust-bg:rgba(11,27,58,.08);--faust-line:rgba(11,27,58,.12);
 /* Rangfarben: Symbol/Rand und Schrift auf Weiß */
 --r1:#B07135;--r1t:#7A4A1E;--r2:#8E9AAE;--r2t:#4F5A6C;--r3:#C9A227;--r3t:#7A5C00;--r4:#5FB8C8;--r4t:#1F6B78;
 /* ältere Namen, die im Code noch vorkommen, zeigen auf die neuen Farben */
 --ink:var(--text);--mut:var(--muted);--card:var(--surface);--up:var(--ok);--dn:var(--bad);--warn:var(--warn-text);
 padding-top:env(safe-area-inset-top,0px)}
/* Dunkelmodus (Lenny, 24.10.2026): folgt der Systemeinstellung, gleiche Rollen wie oben, Kontrast mind. 4,5:1 */
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1430;--surface:#121F45;--text:#E8EEFF;--muted:#AAB7D8;--accent:#2F63FF;--accent-dark:#4A78FF;--accent-text:#8FB0FF;--surface-hover:#1A2B5C;--daily-hover:#2452E8;--line:rgba(143,176,255,.38);--line-soft:rgba(143,176,255,.22);--chip:rgba(232,238,255,.09);--accent-soft:rgba(143,176,255,.16);--ok:#3DCB95;--bad:#FF8A5C;--shadow:0 10px 30px rgba(0,0,0,.35);--warn-bg:#4A2810;--warn-text:#FFC08A;--warn-line:rgba(255,160,90,.4);--faust-bg:rgba(232,238,255,.1);--faust-line:rgba(232,238,255,.18);--r1t:#E3A56C;--r2t:#C9D2E0;--r3t:#EBCB5E;--r4t:#8FDCEA;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1430;--surface:#121F45;--text:#E8EEFF;--muted:#AAB7D8;--accent:#2F63FF;--accent-dark:#4A78FF;--accent-text:#8FB0FF;--surface-hover:#1A2B5C;--daily-hover:#2452E8;--line:rgba(143,176,255,.38);--line-soft:rgba(143,176,255,.22);--chip:rgba(232,238,255,.09);--accent-soft:rgba(143,176,255,.16);--ok:#3DCB95;--bad:#FF8A5C;--shadow:0 10px 30px rgba(0,0,0,.35);--warn-bg:#4A2810;--warn-text:#FFC08A;--warn-line:rgba(255,160,90,.4);--faust-bg:rgba(232,238,255,.1);--faust-line:rgba(232,238,255,.18);--r1t:#E3A56C;--r2t:#C9D2E0;--r3t:#EBCB5E;--r4t:#8FDCEA;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.5 "DM Sans",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.logo,.lead,.isl b{font-family:"Bricolage Grotesque",system-ui,sans-serif}
main{max-width:800px;margin:0 auto;padding:12px 16px 120px}
main:has(.home){max-width:none;padding:12px 0 0}
@media(min-width:900px){main{padding:16px 48px 130px}}
/* Kopfzeile: Logo bzw. „← Hauptmenü“, daneben Lernen, Level, Punkte, Serie */
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
main:has(.home) header{padding:0 16px}@media(min-width:900px){main:has(.home) header{padding:0 48px}}
.hl0,.hr{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.logo{display:inline-flex;align-items:center;gap:8px;font-size:1.25rem;font-weight:800;color:var(--text);background:none;border:0;padding:4px 0;margin:0;min-height:44px}
.logo svg{width:30px;height:20px}
#menu:not([hidden])~.logo{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:.88rem;font-weight:500;background:var(--chip);color:var(--text);margin:0}
/* Punkte auch am Handy sichtbar (Lenny, 26.10.2026) */
.pill b{font-weight:700}.pill.s{background:var(--accent-soft);color:var(--accent-text)}
button.pill{background:var(--surface);border:1px solid var(--line);min-height:40px}
button.pill svg{width:18px;height:18px}#theme{width:40px;padding:0;justify-content:center}
h2{font-size:1.25rem;font-weight:700;margin:0 0 6px;line-height:1.25}
.bar{height:6px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:20px;padding:16px;margin-bottom:12px}
button{font:inherit;font-weight:500;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:16px;padding:9px 16px;min-height:44px;margin:4px 6px 4px 0}
button.p{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text);font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}button:disabled.qok,button:disabled.qbad,button:disabled.on{opacity:1}
/* Buttons: beim Darüberfahren (am Handy kurz beim Antippen) tauschen Füllung und Schrift die Farben (DESIGN.md, Bewegung) */
button,.toc a{transition:background-color .18s ease,color .18s ease,border-color .18s ease}
.notr,.notr *{transition:none!important}
@media(hover:hover){
 button:not(.isl):not(.logo):not(:disabled):hover,.toc a:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
 button.p:not(.isl):not(.logo):not(:disabled):hover{background:var(--surface);color:var(--accent-text);border-color:var(--accent)}
 .daily button:not(.isl):not(.logo):not(:disabled):hover{background:#fff;color:var(--accent);border-color:var(--accent)}
 .daily button.p:not(.isl):not(.logo):not(:disabled):hover{background:var(--accent);color:#fff;border-color:#fff}
}
button:not(.isl):not(.logo):not(:disabled):active,.toc a:active{background:var(--accent);color:#fff;border-color:var(--accent)}
button.p:not(.isl):not(.logo):not(:disabled):active{background:var(--surface);color:var(--accent-text);border-color:var(--accent)}
.daily button:not(.isl):not(.logo):not(:disabled):active{background:#fff;color:var(--accent);border-color:var(--accent)}
.daily button.p:not(.isl):not(.logo):not(:disabled):active{background:var(--accent);color:#fff;border-color:#fff}
/* Einflug der Startseite (nur beim ersten Öffnen in einer Sitzung, Klasse intro). Nur transform und opacity. */
@keyframes inL{from{transform:translateX(-105%);opacity:0}}
@keyframes inR{from{transform:translateX(105%);opacity:0}}
@keyframes inB{from{transform:translateY(105%);opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
@keyframes wipe{to{transform:translateX(100%)}}
@keyframes show{from{opacity:0}}
.home.intro .isl{animation:.5s cubic-bezier(.22,1,.36,1) calc(320ms + var(--i,0)*70ms) backwards}
.home.intro .hl .isl{animation-name:inL}.home.intro .hrr .isl{animation-name:inR}.home.intro .hb .isl{animation-name:inB}
main.intro .logo,.home.intro .hc>*{animation:fadeUp .45s ease-out backwards}
.home.intro .hc>:nth-child(2){animation-delay:70ms}.home.intro .hc>:nth-child(n+3){animation-delay:140ms}
.hbg .wipe{display:none}.home.intro .hbg .wipe{display:block;transform-box:fill-box;animation:wipe 1.8s linear .2s both} /* deckt den Chart ab und gibt ihn von links nach rechts frei */
.home.intro .hbg .wn text{animation:show .4s ease-out var(--d,0ms) backwards} /* Wellenzahl erscheint, wenn die Linie dort ankommt */
@media(prefers-reduced-motion:reduce){.home.intro *,main.intro .logo{animation:none!important}.home.intro .hbg .wipe{display:none!important}}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent-text)}
.mut{color:var(--muted);font-size:.9rem}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}.warn{color:var(--warn-text)}
p.ok::before,.qok::before{content:"✓ "}p.bad::before,.qbad::before{content:"✗ "} /* Richtig/Falsch nie nur über Farbe */
/* Spielrunden: Modus-Zeile, Aufgabe, weiße Chart-Fläche */
.kick{margin:2px 0;color:var(--accent-text);font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.task{font-size:1rem;font-weight:500;margin:0 0 10px}
.chart{background:var(--surface);border:1px solid var(--line-soft);border-radius:22px;overflow:hidden}
svg{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.lab{font:700 11px "DM Sans",system-ui,sans-serif;fill:var(--text);text-anchor:middle}
@media(max-width:600px){.chart:not(.pgc) .lab{font-size:14px}}
.pt circle{fill:var(--accent)}.pt text{font:700 13px "DM Sans",system-ui,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central}
@media(max-width:600px){.pt text{font-size:16px}}
.nextpt{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 6px;border:2px dashed var(--accent-text);border-radius:999px;color:var(--accent-text);font-weight:700;vertical-align:middle;font-size:.9rem}
/* feste Button-Leiste unten: Hauptaktion groß und blau links, Nebenaktionen rechts */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line-soft);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;align-items:center;gap:8px;box-shadow:0 -6px 20px rgba(30,60,140,.08)}
.dock>*{margin:0}.dock p{flex:1 1 100%;margin:0}.dock button[hidden]{display:none}
.dock button.p{flex:1 1 auto;min-height:52px;font-size:1.02rem}
@media(min-width:840px){.dock{left:50%;right:auto;width:800px;transform:translateX(-50%);border:1px solid var(--line-soft);border-bottom:0;border-radius:20px 20px 0 0;padding-left:48px;padding-right:48px}}
.tip{display:flex;gap:8px;align-items:flex-start}.tip svg{flex:none;width:20px;height:20px;margin-top:2px;stroke:var(--accent-text)}
/* Regelstufen als Abzeichen */
.stufe{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.78rem;font-weight:700;margin-right:6px;vertical-align:1px;line-height:1.5}
.stufe .c{font-size:0} /* Doppelpunkt bleibt im Text (1:1), wird aber nicht angezeigt */
.s-regel{background:var(--accent);color:#fff}.s-warn{background:var(--warn-bg);color:var(--warn-text)}.s-faust{background:var(--faust-bg);color:var(--muted)}
.rnote{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:8px 12px;margin:8px 0}.rnote.w{border-color:var(--warn-line)}.rnote.f{border-color:var(--faust-line)}
/* Belohnung (Tagesaufgabe): blau gefüllt, weiße Schrift */
.daily{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:var(--shadow)}
.daily .mut,.daily .ok,.daily .bad,.daily b,.daily h2{color:#fff}
.daily button{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}.daily button.p{background:#fff;color:var(--accent);border-color:#fff}
.hint{border-color:var(--warn-line)}
/* Kalender der Tagesaufgaben */
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.calh button{margin:0;padding:4px 14px;font-size:1.1rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal span{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;font-size:.9rem;line-height:1.1}
.cal .wd{aspect-ratio:auto;font-size:.8rem;font-weight:700;color:var(--muted)}.cal i{font-style:normal;font-size:.8rem;font-weight:700}
.cs{background:var(--ok);color:var(--surface)}.cf{background:var(--bad);color:var(--surface)}.cn,.co{color:var(--muted)}.leg.cn{border:1px solid var(--line)}.cx{opacity:.5}.ct{outline:2px solid var(--accent);outline-offset:1px}
.lgi{white-space:nowrap}.lgi:first-of-type .leg{margin-left:0}
.leg{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;font-size:12px;font-weight:700;border-radius:4px;vertical-align:-3px;margin-left:8px}
/* Blitz-Erkennen: Antworten groß und unten fixiert (Handy), Chart darüber */
.bzhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.bzhead button{margin:0}
#bz{padding-bottom:170px}.bzc{position:relative;aspect-ratio:720/340;display:flex;align-items:center;justify-content:center}.bzc svg{position:absolute;inset:0}@media(max-width:600px){.bzc{aspect-ratio:440/420}}
.bzq{font-size:1.7rem;font-weight:800;text-align:center;color:var(--muted)}.bzq small{font-size:1rem}.bzq.ok{color:var(--ok)}.bzq.bad{color:var(--bad)}.bzover{position:absolute;left:0;right:0;bottom:4px;font-size:1rem;background:var(--surface)}
.bztime{height:6px;background:var(--accent-soft);border-radius:3px;margin:8px 0;overflow:hidden}.bztime i{display:block;height:100%;width:100%;background:var(--accent)}
.bzans{position:fixed;left:0;right:0;bottom:0;z-index:20;max-width:800px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line-soft);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:8px;min-height:140px;align-content:center}
.bzans button{margin:0;min-height:56px;font-size:1rem;line-height:1.2}.bzans button.qok,.bzans button.qbad{background:var(--surface)}.bzans p{grid-column:1/-1;text-align:center;margin:0}
/* Rang-Abzeichen in echten Rangfarben */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.85rem;font-weight:700;padding:2px 10px 2px 8px;border-radius:999px;vertical-align:middle;background:var(--chip);color:var(--muted);border:2px solid transparent;font-family:"DM Sans",system-ui,sans-serif}
.badge svg{width:16px;height:16px}
.badge.r1{background:var(--surface);border-color:var(--r1);color:var(--r1t)}.badge.r1 svg{stroke:var(--r1)}
.badge.r2{background:var(--surface);border-color:var(--r2);color:var(--r2t)}.badge.r2 svg{stroke:var(--r2)}
.badge.r3{background:var(--surface);border-color:var(--r3);color:var(--r3t)}.badge.r3 svg{stroke:var(--r3)}
.badge.r4{background:var(--surface);border-color:var(--r4);color:var(--r4t)}.badge.r4 svg{stroke:var(--r4)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);opacity:0;pointer-events:none;z-index:60;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:16px;font-weight:700;max-width:calc(100% - 32px);text-align:center;transition:.3s;box-shadow:var(--shadow)}#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.qlink{color:var(--accent-text);font-weight:700;text-underline-offset:3px}
.qa{display:block;width:100%;text-align:left;margin:8px 0}.qa:disabled{opacity:1;cursor:default}.qok{border:2px solid var(--ok);color:var(--ok);font-weight:700}.qbad{border:2px solid var(--bad);color:var(--bad)} /* Quiz-Antworten */
/* Lernbereich: Text aus lernen/regelwerk-lernversion.md, am Handy ohne seitliches Scrollen */
.learn{overflow-wrap:break-word}.learn h1{font-size:1.6rem;margin:12px 0 8px}.learn h2{margin:32px 0 8px;padding-top:12px;border-top:1px solid var(--line-soft);scroll-margin-top:64px}
.learn ul,.learn ol{padding-left:22px}.learn li{margin:4px 0}
.learn p{text-align:justify;hyphens:auto;-webkit-hyphens:auto} /* Fließtext im Regelwerk als Blocksatz (Lenny, 26.10.2026), Silbentrennung gegen große Lücken */
.learn li.lv{list-style:none;margin:8px 0 8px -22px;background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:8px 12px}.learn li.lv.w{border-color:var(--warn-line)}.learn li.lv.f{border-color:var(--faust-line)}
.learn table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.92rem;background:var(--surface)}
.learn th,.learn td{border:1px solid var(--line-soft);padding:6px 8px;text-align:left;vertical-align:top;hyphens:auto;-webkit-hyphens:auto}.learn th{background:var(--accent-soft)}
.learn figure{margin:18px 0}.learn figure img{display:block;width:100%;height:auto;border:1px solid var(--line-soft);border-radius:16px;cursor:zoom-in}
.learn figcaption{font-size:14px;line-height:1.4;color:var(--muted);margin-top:6px} /* TradingView-Hinweis: immer direkt unter dem Bild, mindestens 13 px */
/* Kapitel als Reiter-Pillen (aktiv = blau) */
.toc{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:8px 0;margin:4px 0 8px;background:var(--bg);scrollbar-width:none}
.toc a{flex:none;border-radius:999px;padding:8px 13px;background:var(--surface);border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:.88rem;font-weight:500;white-space:nowrap;min-height:40px;display:inline-flex;align-items:center}
.toc a.act{background:var(--accent);border-color:var(--accent);color:#fff}
/* Kapitelleiste: eine Zeile, genau so breit wie der Text. Es stehen nur Kapitel darin, die ganz hineinpassen (tocWatch) */
.toc{overflow:hidden}.toc a.out{display:none}.toc .ts{display:none}@media(max-width:600px){.toc .tl{display:none}.toc .ts{display:inline}}
.ueben{margin:14px 0 0}
.lb{position:fixed;inset:0;z-index:50;background:rgba(11,27,58,.95);overflow:auto;padding:64px 12px 24px}
.lb img{display:block;max-width:none;height:auto;margin:0 auto}.lb p{position:sticky;left:0;color:#fff;font-size:14px;margin:10px auto 0;text-align:center;max-width:760px}
.lb .lbx{position:fixed;top:12px;right:12px;z-index:51;min-height:44px;background:var(--surface);color:var(--text)}
/* ===== Startseite: Inseln an den Bildschirmrändern, Hintergrund-Chart ===== */
.home{position:relative;display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"c c" "l r" "b b";grid-template-rows:auto auto 1fr;column-gap:10px;row-gap:14px;min-height:calc(100vh - 70px);overflow:hidden}
.hbg{position:absolute;inset:0;z-index:0;pointer-events:none}.hbg svg{width:100%;height:100%}.hbg .wn{display:none}
.hc{grid-area:c;position:relative;z-index:1;text-align:center;padding:0 16px}
.lead{font-size:38px;font-weight:800;line-height:1.05;margin:6px 0 14px;letter-spacing:-.01em}.lead span{color:var(--accent-text)}
.hc .daily{text-align:left;margin:0 auto 8px;max-width:520px;padding:14px 16px}.hc .daily h2{font-size:1.1rem}.hc .daily p{margin:4px 0}
.rec{margin:8px auto;max-width:520px}
.hl,.hrr{position:relative;z-index:1;display:flex;flex-direction:column;gap:12px}
.hl{grid-area:l;align-items:flex-start}.hrr{grid-area:r;align-items:flex-end}
.hb{grid-area:b;align-self:end;position:relative;z-index:1;display:flex;justify-content:center;align-items:flex-end;gap:16px;padding-top:18px}
.isl{position:relative;background:var(--surface);color:var(--text);text-align:left;font:inherit;border:1px solid var(--line);box-shadow:var(--shadow);padding:12px 14px;margin:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:44px;width:var(--w,92%)}
button.isl:hover{border-color:var(--accent)}
.isl b{font-size:15px;font-weight:700;line-height:1.2}.isl .d{font-size:13px;color:var(--muted);line-height:1.35}
.isl .ico svg{width:24px;height:24px;stroke:var(--accent-text)}
.isl .sb{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.isl .sb button{margin:0;min-height:40px;padding:6px 12px;font-size:.9rem}
.hl .isl{border-left:0;border-radius:0 28px 22px 0}
.hrr .isl{border-right:0;border-radius:26px 0 0 20px}

<body>
<main>
<header><div class="hl0"><button id="menu" class="pill" hidden>← Hauptmenü</button><button id="tolearn" class="pill" hidden>← Zurück zum Regelwerk</button><button id="home" class="logo" aria-label="Wave Checker, zum Hauptmenü"><svg viewBox="0 0 30 20" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,16 8,6 12,12 19,3 22,9 28,4"/></svg>Wave Checker</button></div>
<div class="hr"><button class="pill" id="theme" aria-label="Design wechseln"></button><button class="pill" id="learn"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></svg>Elliott-Wellen lernen</button><span class="pill">Level <b id="lv">1</b></span><span class="pill pts">Punkte <b id="pt">0</b></span><span class="pill s">Serie <b id="sr">0</b></span></div></header>
<div class="bar"><i id="pb" style="width:0"></i></div>
<div id="view"></div>
</main>
<script>
/* ===== Wave Checker – Prototyp: Impuls (S.38) und Zigzag (S.42) =====
   Aufbau: 1) Regeln je Muster (jede Regel = eine Prüffunktion mit interner ID)
           2) Chart-Generator  3) Zeichnen  4) Spielmodi.
   Alle Prüfungen laufen im Code, ohne KI. Regel-IDs sieht nur der Code, nie der Nutzer. */

// ---- 1) Regeln. Alle Werte u/v sind normalisiert: Punkt 0 = 0, Impuls zeigt nach oben, Zigzag-Welle A nach unten.
// hard=1: harte Regel (Zählung falsch). hard=0: harte Orientierung (nur Warnung).
const L=(v,k)=>Math.abs(v[k]-v[k-1]); // Länge der Welle zwischen Punkt k-1 und k
const IMPR={
 'IMP-1':{page:38,hard:1,wave:'2',name:'Welle 2 unter dem Start von Welle 1',
  hint:'Schau auf Welle 2: Wie weit läuft sie zurück?',
  ex:'Welle 2 darf den Startpunkt der Welle 1 nicht unterschreiten (im Abwärtstrend: nicht überschreiten).',
  ok:v=>v[2]>=v[0]},
 'IMP-2':{page:38,hard:1,wave:'3',name:'Welle 3 ist die kürzeste Impulswelle',
  hint:'Vergleiche die Längen der Wellen 1, 3 und 5.',
  ex:'Welle 3 darf nie die kürzeste der Impulswellen 1, 3 und 5 sein.',
  ok:v=>!(L(v,3)<L(v,1)&&L(v,3)<L(v,5))},
 'IMP-3':{page:38,hard:1,wave:'4',name:'Welle 4 überschneidet Welle 1',
  hint:'Prüfe, wie tief Welle 4 läuft. Berührt sie das Preisterritorium von Welle 1?',
  ex:'Welle 4 darf das Preisterritorium der Welle 1 nicht schneiden (Ausnahme: Diagonale). Schon eine Berührung zählt als Überlappung.',
  ok:v=>v[4]>v[1]},
 'IMP-4':{page:38,hard:1,wave:'1',name:'Falsche Richtung einer Welle',
  hint:'Prüfe die Richtung jeder Welle: 1, 3, 5 laufen mit dem Trend, 2 und 4 dagegen.',
  ex:'Welle 1, 3 und 5 verlaufen immer in Trendrichtung, die Wellen 2 und 4 sind Korrekturen dagegen.',
  ok:v=>v[1]>v[0]&&v[2]<v[1]&&v[3]>v[2]&&v[4]<v[3]&&v[5]>v[4]},
 'W3-4':{page:null,hard:0,wave:'3',name:'Welle 3 expandiert weniger als 123,6 %',
  hint:'Vergleiche Welle 3 mit Welle 1.',
  ex:'Harte Orientierung: Welle 3 sollte mindestens 123,6 % von Welle 1 erreichen. Das ist eine Warnung, kein sicherer Fehler.',
  ok:v=>L(v,3)>=1.236*L(v,1)},
 'W5-3':{page:null,where:'Regelwerk, Abschnitt Welle 5',hard:0,wave:'5',name:'Welle 5 erreicht weniger als 38,2 %',
  hint:'Miss Welle 5 mit der Fibonacci-Expansion über den Start von Welle 1 und die Enden von Welle 3 und 4.',
  ex:'Harte Orientierung: Welle 5 sollte mindestens 38,2 % erreichen (Expansion über den Start von Welle 1 sowie die Enden von Welle 3 und 4). Das ist eine Warnung, kein sicherer Fehler.',
  ok:v=>L(v,5)>=.382*(v[3]-v[0])}
};
const ZZR={ // Zigzag: Punkte 0, A, B, C (Abwärtskorrektur, im Aufwärtsfall spiegelbildlich)
 'ZZ-2':{page:42,hard:1,wave:'B',name:'Welle B überschreitet den Start von Welle A',
  hint:'Schau auf das Ende von Welle B: Wie weit läuft sie gegen Welle A zurück?',
  ex:'Welle B darf den Startpunkt der Welle A nicht überschreiten (bei steigenden Preisen: nicht unterschreiten).',
  ok:u=>u[2]<u[0]},
 'ZZ-3':{page:42,hard:1,wave:'C',name:'Welle C endet nicht jenseits vom Ende der Welle A',
  hint:'Vergleiche das Ende von Welle C mit dem Ende von Welle A.',
  ex:'Welle C muss unter dem Endpunkt der Welle A enden (bei steigenden Preisen: darüber).',
  ok:u=>u[3]<u[1]}
};
// Regeltexte passend zur Chartrichtung (Lenny, 26.10.2026): Klammern zur Gegenrichtung entfallen, und bei gespiegeltem Chart
// werden Richtungswörter getauscht (unter ↔ über, Tief ↔ Hoch …).
let FLIP=false;
const MSW=[['unterschreiten','überschreiten'],['unterschreitet','überschreitet'],['unterhalb','oberhalb'],['unter','über'],['Tiefs','Hochs'],['Tief','Hoch'],
 ['tiefer','höher'],['darunter','darüber'],['fallenden','steigenden'],['fallende','steigende'],['Abwärtstrend','Aufwärtstrend'],['abwärts','aufwärts']];
const MRX=new RegExp('(?<![\\wäöüÄÖÜß])('+MSW.flat().join('|')+')(?![\\wäöüÄÖÜß])','g'),MMAP=Object.fromEntries(MSW.flatMap(([a,b])=>[[a,b],[b,a]]));
const mt=s=>{if(typeof s!=='string')return s;
 s=s.replace(/ ?\((?:im (?:Abwärts|Aufwärts)trend|bei (?:steigenden|fallenden) Preisen)[^)]*\)/g,'');
 return FLIP?s.replace(MRX,w=>MMAP[w]):s};
const pct=x=>(Math.round(x*1000)/10).toString().replace('.',',')+' %';
const PAT={
 imp:{key:'imp',title:'Impuls',labels:['0','1','2','3','4','5'],waves:['1','2','3','4','5'],rules:IMPR,viol:['IMP-1','IMP-2','IMP-3'],
  sign:p=>p[1]>=p[0]?1:-1, // Richtung: Welle 1 bestimmt den Trend
  endMsg:'Der Chart endet im Extrem von Welle 5. Setze Punkt 5 an das letzte Hoch (im Abwärtstrend: Tief) des Charts.',
  info:v=>'<p class="mut">Orientierung: Welle 2 lief '+pct(L(v,2)/L(v,1))+' zurück (häufig 50, 61,8 oder 78,6 %), Welle 4 '+pct(L(v,4)/L(v,3))+' (häufig 38,2 oder 50 %).'+(v[5]<v[3]?' Welle 5 endet unter dem Hoch von Welle 3: eine Truncation, die in echten Charts selten vorkommt.':'')+'</p>'},
 zig:{key:'zig',title:'Zigzag',labels:['0','A','B','C'],waves:['A','B','C'],rules:ZZR,viol:['ZZ-2','ZZ-3'],
  sign:p=>p[1]<=p[0]?1:-1, // Richtung: Welle A bestimmt die Korrektur
  struct:u=>u[1]<u[0]&&u[2]>u[1]&&u[3]<u[2], // App-Vorgabe: A und C laufen in eine Richtung, B dagegen
  structMsg:'Bei einem Zigzag laufen A und C in dieselbe Richtung, B läuft dagegen. Prüfe die Richtung deiner Punkte.',
  endMsg:'Der Chart endet im Extrem von Welle C. Setze Punkt C an das letzte Tief (bei steigenden Preisen: Hoch) des Charts.',
  info:v=>'<p class="mut">Orientierung: Welle B lief '+pct(L(v,2)/L(v,1))+' von A zurück (maximal knapp unter 100 %), Welle C erreicht '+pct(L(v,3)/L(v,1))+' von A (häufig 100 %, zwischen 61,8 und 161,8 %).</p><p class="mut">Hinweis: Dass A und C fünfteilig sind, prüft die App erst in der späteren Subwellen-Stufe.</p>'}
};
// Flats (Punkte 0, A, B, C): A und B dreiteilig, C fünfteilig. Drei Varianten, jede mit eigenen Regeln.
const MIR=' (bei steigenden Preisen spiegelbildlich)';
const FLR={
 fr:{ // Regular Flat
  'FR-2':{page:46,hard:1,wave:'B',name:'Welle B überschreitet den Start von Welle A',
   hint:'Schau, wo Welle B endet: Nähert sie sich dem Start von Welle A an oder schießt sie darüber?',
   ex:'Beim Regular Flat nähert sich Welle B dem Startpunkt der Welle A an, statt ihn zu überschreiten.'+MIR,ok:u=>u[2]<u[0]},
  'FR-3':{page:46,hard:1,wave:'C',name:'Welle C endet nicht unter dem Tief von Welle A',
   hint:'Vergleiche das Ende von Welle C mit dem Ende von Welle A.',
   ex:'Beim Regular Flat endet Welle C leicht unter dem Tief von Welle A.'+MIR,ok:u=>u[3]<u[1]}},
 fe:{ // Expanded Flat
  'FE-2':{page:46,hard:1,wave:'B',name:'Welle B überschreitet den Start von Welle A nicht',
   hint:'Schau, wo Welle B endet: Kommt sie über den Start von Welle A hinaus?',
   ex:'Beim Expanded Flat überschreitet Welle B den Startpunkt der Welle A.'+MIR,ok:u=>u[2]>u[0]},
  'FE-3':{page:46,hard:1,wave:'C',name:'Welle C endet nicht unter dem Tief von Welle A',
   hint:'Vergleiche das Ende von Welle C mit dem Ende von Welle A.',
   ex:'Beim Expanded Flat endet Welle C unterhalb des Tiefs von Welle A.'+MIR,ok:u=>u[3]<u[1]}},
 fru:{ // Running Flat
  'FRU-2':{page:46,hard:1,wave:'B',name:'Welle B überschießt den Start von Welle A nicht',
   hint:'Schau, wo Welle B endet: Schießt sie über den Start von Welle A hinaus?',
   ex:'Beim Running Flat überschießt Welle B den Startpunkt der Welle A.'+MIR,ok:u=>u[2]>u[0]},
  'FRU-3':{page:46,hard:1,wave:'C',name:'Welle C bildet ein neues Tief unter Welle A',
   hint:'Vergleiche das Ende von Welle C mit dem Ende von Welle A.',
   ex:'Beim Running Flat schafft es Welle C nicht, ein neues Tief unterhalb der Welle A auszubilden. Endet C genau auf dem Tief von A, ist das kein neues Tief.'+MIR,ok:u=>u[3]>=u[1]}}
};
// Gemeinsame harte Orientierung für Welle B in Flats
const WB2={page:null,hard:0,wave:'B',name:'Welle B liegt außerhalb von 88,7 % bis 161,8 % der Welle A',
 hint:'Vergleiche die Länge von Welle B mit Welle A.',
 ex:'Harte Orientierung: Welle B retraced mindestens 88,7 % bis maximal 161,8 % der Welle A. Das ist eine Warnung, kein sicherer Fehler.',
 ok:u=>{const r=L(u,2)/L(u,1);return r>=.887&&r<=1.618}};
const flatPat=(key,title,viol)=>({key,title,labels:['0','A','B','C'],waves:['A','B','C'],rules:{...FLR[key],'WB-2':WB2},viol,
 sign:PAT.zig.sign,struct:PAT.zig.struct,structMsg:PAT.zig.structMsg,
 endMsg:'Der Chart endet im Extrem von Welle C. Setze Punkt C an das letzte Tief (bei steigenden Preisen: Hoch) des Charts.',
 info:v=>'<p class="mut">Orientierung: Welle B lief '+pct(L(v,2)/L(v,1))+' von A zurück (Regelwerk: mindestens 88,7 %, höchstens 161,8 %). Welle C erreicht '+pct(L(v,3)/L(v,1))+' von A (häufig 100 %, bis 261,8 %).</p><p class="mut">Hinweis: Dass A und B dreiteilig und C fünfteilig sind, prüft die App erst in der späteren Subwellen-Stufe.</p>'});
PAT.fr=flatPat('fr','Regular Flat',['FR-2','FR-3']);
PAT.fe=flatPat('fe','Expanded Flat',['FE-2','FE-3']);
PAT.fru=flatPat('fru','Running Flat',['FRU-2','FRU-3']);

// ---- 2) Generator: würfelt Wellenlängen, bis die Prüfung das gewünschte Ergebnis liefert.
const rnd=(a,b)=>a+Math.random()*(b-a);
function genImp(violate){ // violate=null: regelkonform; sonst genau diese Regel verletzen
 // Truncation ist selten: nur in ca. 4 % der regelkonformen Charts, nie in Fehler-Aufgaben.
 const allowTrunc=!violate&&Math.random()<.04;
 for(let n=0;n<6000;n++){
  // Profil: meist Welle 3 verlängert, manchmal Welle 5 verlängert, sonst ohne deutliche Verlängerung; Welle 2 und 4 mal flach, mal tief
  const pr=Math.random(),ext=pr<.55?3:pr<.75?5:0,deep2=Math.random()<.5,deep4=Math.random()<.4;
  const l1=rnd(.7,1.6)*100,p1=l1,p2=p1-(deep2?rnd(.6,1.3):rnd(.25,.65))*l1,l3=(ext===3?rnd(1.6,3.4):ext===5?rnd(1.24,1.8):rnd(.7,1.9))*l1,p3=p2+l3,
   p4=p3-(deep4?rnd(.45,.75):rnd(.15,.45))*l3,p5=p4+(ext===5?rnd(1.4,2.8):rnd(.4,1.6))*l1;
  const v=[0,p1,p2,p3,p4,p5],f=violate?hardFails(PAT.imp,v):check(PAT.imp,v); // Fehler-Aufgaben: nur harte Regeln zählen
  if(allowTrunc?!(p5<p3):p5<p3)continue;
  if(violate==='IMP-2'){const r=l3/Math.min(l1,p5-p4);if(r<.6||r>.85)continue} // Welle 3 klar, aber nicht übertrieben kürzer als die kürzere der Wellen 1 und 5
  if(violate?(f.length===1&&f[0]===violate):f.length===0) return v;
 }
}
function genZig(violate){
 for(let n=0;n<6000;n++){
  const LA=rnd(.8,1.6)*100,u1=-LA,rB=violate==='ZZ-2'?rnd(1.05,1.4):rnd(.3,.9),u2=u1+rB*LA,
   LC=violate==='ZZ-3'?rB*LA*rnd(.55,.95):rnd(.6,1.7)*LA,u3=u2-LC;
  const v=[0,u1,u2,u3],f=check(PAT.zig,v);
  if(violate?(f.length===1&&f[0]===violate):f.length===0) return v;
 }
}
function genFlat(kind,violate){
 const P=PAT[kind];
 for(let n=0;n<6000;n++){
  const LA=rnd(.8,1.6)*100,u1=-LA;
  // B über dem Start von A? (Regular: nein, Expanded/Running: ja; bei einer Verletzung genau umgekehrt)
  const bUp=kind==='fr'?violate==='FR-2':kind==='fe'?violate!=='FE-2':violate!=='FRU-2';
  // C unter dem Tief von A? (Regular/Expanded: ja, Running: nein; bei einer Verletzung umgekehrt)
  const cLow=kind==='fr'?violate!=='FR-3':kind==='fe'?violate!=='FE-3':violate==='FRU-3';
  const u2=u1+(bUp?rnd(1.03,1.35):rnd(.89,.99))*LA,
   u3=cLow?u1-(kind==='fr'?rnd(.03,.2):rnd(.1,.6))*LA:u1+rnd(.1,.5)*LA;
  const v=[0,u1,u2,u3];if(!P.struct(v))continue;
  const f=violate?hardFails(P,v):check(P,v);
  if(violate?(f.length===1&&f[0]===violate):f.length===0)return v;
 }
}
function genTri(kind,violate){
 const P=PAT[kind],con=kind==='trk',vj=violate?2+Math.floor(Math.random()*4):0; // vj = gebrochene Welle (2..5 = B..E)
 const Ls=[rnd(1,1.6)*100];
 for(let j=2;j<=5;j++){const broken=j===vj;
  Ls.push(Ls[j-2]*(con?(broken?rnd(1.05,1.35):rnd(.7,.92)):(broken?rnd(.7,.95):rnd(1.08,1.4))));}
 P.lastVW=violate?'ABCDE'[vj-1]:undefined; // die Welle, die gegen die Regel verstößt
 const u=[0,Ls[0],0,0,0,0];u[2]=u[1]-Ls[1];u[3]=u[2]+Ls[2];u[4]=u[3]-Ls[3];u[5]=u[4]+Ls[4];
 return u;
}
function genDiag(kind,violate){
 const P=PAT[kind],imp=P.implied||{};P.lastVW=undefined;
 for(let n=0;n<60000;n++){
  const L1=rnd(.8,1.6)*100,wide=!!violate;let L2,L3,L4,L5;
  if(kind==='de'){L2=L1*rnd(.3,.8);L3=L1*rnd(wide?.7:1.1,wide?1.8:2);L4=L3*(violate==='DE-9'?rnd(1.02,1.3):violate==='DIAG-2'?rnd(.3,.9):rnd(.5,.887));L5=L3*rnd(1.1,1.6);} // Welle 4 retraced 50 % bis 88,7 % der Welle 3 (DE-9)
  else{L2=L1*rnd(.3,.85);L3=L1*rnd(.4,wide?1.5:.98);L4=L1*rnd(.15,.9);L5=L1*rnd(.15,wide?1.3:.95);}
  const u=[0,L1,L1-L2,L1-L2+L3,L1-L2+L3-L4,L1-L2+L3-L4+L5];
  // Form: Hochs steigen (3 über 1, 5 über 3, Regel DIAG-5); Tiefs steigen (bei der Expandierenden Diagonale folgt das aus DE-9)
  if(!(u[3]>u[1]&&u[5]>u[3]&&u[4]>u[0]&&(kind==='de'?(u[4]>u[2]||violate==='DE-9'||violate==='DIAG-2'):u[4]>u[2])))continue;
  const f=hardFails(P,u),Ln=j=>Math.abs(u[j]-u[j-1]);
  if(violate){

// Welle 4 bleibt über dem Ende von Welle 1, Welle 3 ≥ 123,6 % von Welle 1, Welle 5 ≥ 38,2 %) und Kerzen je Welle.
const WPV=[0,1,.45,2.6,1.9,3.3],WPN=[12,8,26,10,16],WPS=13;
function wpCandles(){ // feste Kerzen (gleicher Chart bei jedem Öffnen): Subwellen 5-teilig bzw. 3-teilig, dazu kleine Zacken
 let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647,c=[];let prev=0;
 WPN.forEach((n,w)=>{const a=WPV[w],b=WPV[w+1],fr=w%2?[.62,.36,1]:[.38,.2,.8,.58,1],m=fr.length,piv=fr.map(f=>a+(b-a)*f);
  for(let i=1;i<=n;i++){const q=i/n*m,k=Math.min(m-1,Math.floor(q-1e-9)),p0=k?piv[k-1]:a,p1=piv[k],u=q-k;
   let cl=p0+(p1-p0)*u;if(i<n&&Math.abs(u-1)>1e-6)cl+=(r()-.5)*Math.abs(b-a)*.06; // kleine Zacken, nie über die Wendepunkte hinaus
   cl=Math.min(Math.max(cl,Math.min(a,b)),Math.max(a,b));if(i===n)cl=b;
   const o=prev,hi=Math.max(o,cl)+r()*.035,lo=Math.min(o,cl)-r()*.035;c.push({o,c:cl,hi:Math.min(hi,Math.max(a,b)),lo:Math.max(lo,Math.min(a,b)),w}) /* Dochte bleiben innerhalb der Welle: die Wendepunkte sind die echten Extreme */;prev=cl}});
 return c}

 const X=p=>ML+(p-lo)/(hi-lo)*(Wd-ML-MR),Y=i=>T+i*WPS+WPS/2,H=T+n*WPS+40,start=[0];WPN.forEach(k=>start.push(start[start.length-1]+k));
 const sIdx=STN.map(s=>start[s.w-1]+Math.max(0,Math.min(WPN[s.w-1]-1,Math.round(WPN[s.w-1]*s.f)-1)));
 const lim=cur<0?n:sIdx[cur],dt=1500/n; // bis zur aktuellen Station kräftig, danach blass
 let s='<svg class="wc" width="'+Wd+'" height="'+H+'" viewBox="0 0 '+Wd+' '+H+'" aria-hidden="true"><g class="grid">';
 for(let y=T;y<H;y+=52)s+='<line x1="0" x2="'+Wd+'" y1="'+y+'" y2="'+y+'"/>';

 for(let w=1;w<=5;w++){const i=start[w]-1,top=w%2===1,x=X(c[i].c)+(top?18:-18); // Wellenzahl am Wendepunkt: Hochs rechts, Tiefs links

   (st.wn?'<small>Welle '+st.w+' · '+st.wn+'</small>':'')+'<b>'+st.t+'</b>'+(sub?'<span>'+sub+'</span>':'')+(isCur?'<span class="here">Hier weitermachen</span>':'')+'</div>'});

// Antippen in der Nähe eines gesetzten Punktes greift ihn, sonst wird ein neuer Punkt gesetzt. pic() liefert das SVG mit den aktuellen Punkten.
function bindPoints(m,n,pic,render){
 const svg=$('#svg'),xAt=ev=>{const r=$('#svg').getBoundingClientRect();return (ev.clientX-r.left)/r.width*W};
 const idxOf=x=>Math.max(0,Math.min(45,Math.round((x-X0)/DX)));

  const f=(xAt(e)-X0)/DX;let k=-1,best=1.2;
  m.sel.forEach((i,j)=>{if(Math.abs(f-i)<=best){best=Math.abs(f-i);k=j}});
  if(k>=0){ // gesetzten Punkt verschieben, er bleibt zwischen seinen Nachbarpunkten
   const mv=ev=>{const lo=k>0?m.sel[k-1]+1:0,hi=k<m.sel.length-1?m.sel[k+1]-1:45,nw=Math.max(lo,Math.min(hi,idxOf(xAt(ev))));

   startDrag(svg,e,mv,()=>render());
  }else if(m.sel.length<n){
   const i=idxOf(xAt(e));
   if(m.sel.length&&i<=m.sel[m.sel.length-1])return render('<span class="warn">Der Punkt muss rechts vom vorherigen liegen.</span>');
   m.sel.push(i);render();
  }};

// Modus 1: Chart durchzählen
function count(P){
 const R=makeRound(P,null),n=P.labels.length,m={sel:[],tips:0,failed:false,done:false};
 const render=(fb)=>{
  $('#view').innerHTML='<p class="kick">Chart durchzählen · '+P.title+'</p><p class="task">Tippe nacheinander die Punkte '+P.labels.join(', ')+' auf den Chart. Gesetzte Punkte kannst du anfassen und verschieben. Nächster Punkt: <span class="nextpt">'+(m.sel.length<n?P.labels[m.sel.length]:'fertig')+'</span></p><div class="chart">'+draw(R,m.sel,false,m.tl&&P.tri?m.sel:null)+'</div>'+(m.tl&&P.tri?'<p class="mut">Gestrichelt: Trendlinien durch '+(P.waves[0]==='A'?'A, C (bis E) und durch B, D.':'die Enden der Wellen 1, 3 (bis 5) und der Wellen 2, 4.')+'</p>':'')+'<div class="dock">'+
  '<button class="p" id="chk" '+(m.sel.length<n||m.done?'disabled':'')+'>Prüfen</button><button id="und" '+(m.done?'disabled':'')+'>Zurück</button><button id="rst" '+(m.done?'disabled':'')+'>Neu setzen</button></div><div class="card" id="fb" '+(fb?'':'hidden')+'>'+(fb||'')+'</div>';
  bindPoints(m,n,()=>draw(R,m.sel,false,m.tl&&P.tri?m.sel:null),render);
  $('#und').onclick=()=>{m.sel.pop();render()};$('#rst').onclick=()=>{m.sel=[];render()};
  $('#chk').onclick=verify;
 };
 const fail=html=>{m.failed=true;if(st.streak)st.streak=0,stats();return html};
 const verify=()=>{
  m.tl=true; // Trendlinien (nur Dreiecke) erscheinen ab dem ersten Prüfen
  // Platzierung und Richtung sind App-Vorgaben (keine Regelwerk-Regeln) und werden vor den Regeln geprüft.
  // Jeder Wendepunkt muss am echten Extrem sitzen (Toleranz TOL Kerzen), sonst ergibt die Zählung keinen Sinn (z. B. A zu früh gesetzt).
  const bad=m.sel.findIndex((i,k)=>k>0&&Math.abs(i-R.piv[k])>TOL);
  if(bad===n-1)return render(fail('<p class="bad">Noch nicht ganz.</p><p>'+P.endMsg+'</p>'));
  if(bad>0)return render(fail('<p class="bad">Noch nicht ganz.</p><p>Punkt '+P.labels[bad]+' sitzt nicht am relevanten Wendepunkt. Setze ihn an das Hoch bzw. Tief, wo die Bewegung wirklich dreht, nicht an eine kleinere Zwischenspitze.</p>'));
  const v=norm(P,m.sel.map(i=>R.pr[i]));
  if(P.struct&&!P.struct(v))return render(fail('<p class="bad">Noch nicht ganz.</p><p>'+P.structMsg+'</p>'));
  const f=hardFails(P,v);
  if(f.length){fail();return tipUI(f)}
  m.done=true;const gain=Math.max(4,10-3*m.tips)-(m.failed?2:0);
  if(!m.failed)st.streak++;st.pts+=gain;stats();exSolved(P.key,m.tips);pathMark('count'); // zählt für die Ränge
  const w=warns(P,v).map(id=>lvlNote(P,id)).join('');
  render('<p class="ok">Regelkonform! +'+gain+' Punkte</p><p class="mut">Die App prüft die Regeln. Die Wendepunkte müssen dafür an den echten Extremen sitzen.</p>'+w+P.info(v)+'<button class="p" id="nxt">Nächster Chart</button>');
  $('#nxt').onclick=()=>count(P);
 };
 const tipUI=f=>{const r=P.rules[f[0]];
  const lines=['Die Zählung ist noch nicht regelkonform.'];
  if(m.tips>=1)lines.push('Tipp 1: '+mt(r.hint));
  if(m.tips>=2)lines.push('Tipp 2: '+stufe('regel')+'Es geht um die Regel „'+mt(r.name)+'“.');
  if(m.tips>=3)lines.push('Tipp 3: '+tag(P,f[0])+'. '+r.ex);
  render('<p class="bad">Noch nicht ganz.</p>'+lines.map(tipLine).join('')+(m.tips<3?'<button id="tip">Tipp anzeigen</button>':''));
  const t=$('#tip');if(t)t.onclick=()=>{m.tips++;tipUI(f)};
 };
 render();
}

// Modus 3: Muster erkennen – zufälliges Muster, ohne Beschriftung im Chart.
// Richtig ist jedes Muster, zu dem der Chart regelkonform ist (Entscheidung Lenny 21.10.2026), nicht nur das generierte.
const fmtSub=s=>s.split('').join('-');
// Passt der Chart R regelkonform zum Muster Q? Liefert null (passt) oder den Grund in Worten für den Nutzer (ohne Regel-IDs).
// Geprüft werden: gleiche Punktanzahl, Richtung/Struktur, alle HARTEN Regeln von Q an den Wendepunkten, Teilstruktur (subs).
function misfit(Q,R){
 const sel='beim Muster „'+Q.title+'“';
 if(Q.labels.length!==R.piv.length)return 'Der Chart hat '+(R.piv.length-1)+' Wellen, '+sel+' sind es '+(Q.labels.length-1)+'.';
 const v=norm(Q,R.piv.map(i=>R.pr[i]));
 if(Q.struct&&!Q.struct(v))return 'Die Richtung der Wellen passt nicht '+sel+'.';
 const f=hardFails(Q,v);
 if(f.length)return 'Verletzte Regel '+sel+': '+f.map(id=>'„'+mt(Q.rules[id].name)+'“ ('+tag(Q,id)+')').join(', ')+'.';
 if(!Q.subs.includes(R.P.subs[0]))return 'Die Teilwellen passen nicht: Hier sind sie '+fmtSub(R.P.subs[0])+' aufgebaut, '+sel+' '+Q.subs.map(fmtSub).join(' oder ')+'.';
 return null;
}
// Ein Satz, woran man zwei auf dem Chart gleich regelkonforme Muster unterscheidet
const diffMsg=(P,Q)=>P.ctx&&Q.ctx?'Unterschied: Auf dem Chart allein passen beide, entscheidend ist die Stelle im größeren Trend ('+P.title+': '+P.ctx+'; '+Q.title+': '+Q.ctx+').':'Unterschied: Vergleiche die beiden Beschreibungen unten.';
// Muster erkennen: zuerst den Schwierigkeitsgrad wählen

  '<p><button class="p" onclick="recogHard()">Schwer: Chart selbst zählen</button><br><span class="mut">Zählweise wählen, Punkte setzen, dann das genaue Muster bestimmen (+20 Punkte, Bonus +10).</span></p>'+
  '<p><button onclick="home()">Zurück</button></p></div>';
}
function recogNormal(){

// Muster erkennen – Schwer: Chart selbst zählen. Erst die Zählweise wählen, dann Punkte setzen wie in „Chart durchzählen“.
// Richtig ist die Zählung, wenn die Punkte für mindestens ein Muster dieser Zählweise alle harten Regeln erfüllen
// (inklusive Richtung und Teilstruktur, wie bei misfit). Danach Bonusfrage: welches Muster genau?
const ZW=[
 {name:'1-2-3-4-5',hint:'Impuls und Diagonalen',labels:PAT.imp.labels,pats:['imp','dl','db','de']},
 {name:'A-B-C',hint:'Zigzag und Flats',labels:PAT.zig.labels,pats:['zig','fr','fe','fru']},
 {name:'W-X-Y',hint:'Double Zigzag',labels:PAT.dz.labels,pats:['dz']},
 {name:'W-X-Y-X-Z',hint:'Dreifache Form',labels:PAT.tz.labels,pats:['tz']},
 {name:'A-B-C-D-E',hint:'Dreiecke',labels:PAT.trk.labels,pats:['trk','tre']}];
// Gesetzte Punkte (Kerzenindizes idx) des Charts R gegen Muster Q prüfen: null = regelkonform, sonst {kind:'subs'|'struct'|'rules', f}
function fitPts(Q,R,idx){
 if(!Q.subs.includes(R.P.subs[0]))return{kind:'subs'};
 const v=norm(Q,idx.map(i=>R.pr[i]));
 if(Q.struct&&!Q.struct(v))return{kind:'struct'};
 const f=hardFails(Q,v);return f.length?{kind:'rules',f}:null;
}
const fitWhy=(Q,r,P)=>r.kind==='subs'?'Die Teilwellen passen nicht: Hier sind sie '+fmtSub(P.subs[0])+' aufgebaut, beim Muster „'+Q.title+'“ '+Q.subs.map(fmtSub).join(' oder ')+'.':
 r.kind==='struct'?'Die Richtung der Wellen passt nicht zum Muster „'+Q.title+'“.':'Verletzte Regel beim Muster „'+Q.title+'“: '+r.f.map(id=>'„'+mt(Q.rules[id].name)+'“ ('+tag(Q,id)+')').join(', ')+'.';
function recogHard(D,fb0){ // D: Tagesaufgabe (fester Chart, höchstens 3 Versuche, siehe Abschnitt 6), sonst zufällig
 const keys=Object.keys(PAT).filter(k=>!PAT[k].noRecog),P=D?D.P:PAT[keys[Math.floor(Math.random()*keys.length)]],R=D?D.R:makeRound(P,null),
  m={z:D&&D.z!=null?D.z:null,sel:D&&D.sel?D.sel.slice():[],tips:D?D.tips:0,failed:D?D.tries>0:false,done:false};
 const Z=()=>ZW[m.z],pic=()=>draw({...R,P:{labels:Z()?Z().labels:[]}},m.sel,false,null); // nackter Chart, Beschriftung nur an gesetzten Punkten
 const fail=html=>{m.failed=true;m.sig=JSON.stringify([m.z,m.sel]);if(st.streak)st.streak=0,stats();if(D){D.tries++;D.save()}return html}; // m.sig: Prüfen bleibt gesperrt, bis sich etwas ändert (Doppeltipp kostet keinen Versuch) // Tagesaufgabe: jeder Fehlversuch zählt
 const render=(fb)=>{
  const z=Z(),n=z?z.labels.length:0;
  if(D&&!m.done){D.z=m.z;D.sel=m.sel.slice();D.fb=(fb||'').replace(/<button id="tip">[^<]*<\/button>/,'');D.save()} // Stand der Tagesaufgabe merken
  $('#view').innerHTML='<p class="kick">'+(D?'Tagesaufgabe #'+D.no+' · Versuch '+Math.min(3,D.tries+1)+' von 3':'Muster erkennen · Schwer')+'</p><p class="task">'+(D?'':'Zähle den Chart selbst. ')+(z?'Zählweise '+z.name+': Tippe nacheinander die Punkte '+z.labels.join(', ')+' auf den Chart. Gesetzte Punkte kannst du anfassen und verschieben. Nächster Punkt: <span class="nextpt">'+(m.sel.length<n?z.labels[m.sel.length]:'fertig')+'</span>':'Wähle zuerst die Zählweise.')+'</p>'+
   '<div class="chart">'+pic()+'</div><div class="card"><b>Zählweise</b><br>'+ZW.map((w,i)=>'<button data-z="'+i+'" class="'+(m.z===i?'on':'')+'" '+(m.done?'disabled':'')+'>'+w.name+' · '+w.hint+'</button>').join('')+'</div>'+
   (z?'<div class="dock"><button class="p" id="chk" '+(m.sel.length<n||m.done||m.sig===JSON.stringify([m.z,m.sel])?'disabled':'')+'>Prüfen</button><button id="und" '+(m.done?'disabled':'')+'>Zurück</button><button id="rst" '+(m.done?'disabled':'')+'>Neu setzen</button></div>':'')+
   '<div class="card" id="fb" '+(fb?'':'hidden')+'>'+(fb||'')+'</div>';
  if(m.done)return;

 const verify=()=>{

  // Passt die Zählweise grundsätzlich? Geprüft an den echten Wendepunkten, bevor es um einzelne Punkte geht (Lenny, 26.10.2026)
  if(!z.pats.some(k=>!fitPts(PAT[k],R,R.piv)))return render(fail('<p class="bad">Noch nicht ganz.</p><p>Die Zählweise '+z.name+' passt nicht zu diesem Chart. Achte auf den Aufbau der Wellen: Welche sind dreiteilig, welche fünfteilig? Wähle dann eine andere Zählweise.</p>'));
  // Platzierung wie in „Chart durchzählen“: jeder Punkt am echten Extrem (Toleranz TOL Kerzen)
  const bad=m.sel.findIndex((i,k)=>k>0&&Math.abs(i-R.piv[k])>TOL);
  if(bad===n-1)return render(fail('<p class="bad">Noch nicht ganz.</p><p>Der Chart endet im Extrem der letzten Welle. Setze Punkt '+z.labels[n-1]+' an das letzte Hoch bzw. Tief des Charts.</p>'));
  if(bad>0)return render(fail('<p class="bad">Noch nicht ganz.</p><p>Punkt '+z.labels[bad]+' sitzt nicht am relevanten Wendepunkt. Setze ihn an das Hoch bzw. Tief, wo die Bewegung wirklich dreht, nicht an eine kleinere Zwischenspitze.</p>'));
  const res=z.pats.map(k=>({Q:PAT[k],r:fitPts(PAT[k],R,m.sel)})),okQ=res.filter(x=>!x.r).map(x=>x.Q);

   fail();const rank=x=>({subs:300,struct:200,rules:100})[x.r.kind]+(x.r.f?x.r.f.length:0)-(x.Q===P?.5:0);
   return tipUI(res.sort((a,b)=>rank(a)-rank(b))[0]);}
  m.done=true;m.ok=okQ;if(D)D.solvedNow(m.tips);const gain=Math.max(8,20-6*m.tips)-(m.failed?4:0);
  if(!m.failed)st.streak++;st.pts+=gain;stats();exSolved(P.key,m.tips,true);if(!D)pathMark('recog'); // Rang: Schwer bzw. Tagesaufgabe

 const tipUI=({Q,r})=>{const z=Z();

  const lines=['Die Zählung ist noch nicht regelkonform.'];

   if(m.tips>=3){const g={};z.pats.forEach(k=>{const s=PAT[k].subs.map(fmtSub).join(' oder ');(g[s]=g[s]||[]).push(PAT[k].title)}); // Muster mit gleicher Teilstruktur zusammenfassen
    lines.push('Tipp 3: Bei der Zählweise '+z.name+' sind sie '+Object.entries(g).map(([s,t])=>s+' ('+t.join(', ')+')').join(', ')+' aufgebaut. Wähle eine andere Zählweise.');}
  }else{const id=r.f[0],x=Q.rules[id];
   if(m.tips>=1)lines.push('Tipp 1: '+mt(x.hint));
   if(m.tips>=2)lines.push('Tipp 2: '+stufe('regel')+'Es geht um die Regel „'+mt(x.name)+'“.');

  const t=$('#tip');if(t)t.onclick=()=>{m.tips++;if(D){D.tips=m.tips;D.save()}tipUI({Q,r})}; // Tagesaufgabe: Tipps werden vermerkt
 };
 // Bonusfrage: Welches Muster genau? Gibt es in der Zählweise nur ein Muster, ist es eindeutig: Bonus ohne Frage.

// Modus 4: Subwellen zählen. Längerer Chart; erst die Hauptpunkte, dann die Subwellen der Wellen einzeln.

// Kalender der Tagesaufgaben: ein Monat, Wochen von Montag bis Sonntag, je Tag gelöst / nicht gelöst / nicht gespielt.

const MONATE=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'],WTAGE=['Mo','Di','Mi','Do','Fr','Sa','So'];
function dHist(o){const h={...(o.hist||{})};if(o.day&&o.day.done&&!h[o.day.date])h[o.day.date]=o.day.solved?'s':'f';
 if(o.last&&!h[o.last])h[o.last]='s';return h}
function calendar(el,y,m){const today=berlinDate(),h=dHist(dLoad());if(y===undefined){y=+today.slice(0,4);m=+today.slice(5,7)-1}
 const p2=n=>String(n).padStart(2,'0'),first=(new Date(Date.UTC(y,m,1)).getUTCDay()+6)%7,days=new Date(Date.UTC(y,m+1,0)).getUTCDate(); // first: 0 = Montag
 const ym=y*12+m,min=+DAY0.slice(0,4)*12+ +DAY0.slice(5,7)-1,max=+today.slice(0,4)*12+ +today.slice(5,7)-1;let ok=0,bad=0,cells='';
 for(let i=0;i<first;i++)cells+='<span></span>';
 for(let d=1;d<=days;d++){const s=y+'-'+p2(m+1)+'-'+p2(d),wd=WTAGE[(first+d-1)%7],v=h[s];let c,t;
  if(s<DAY0){c='cx';t='vor dem Start der Tagesaufgabe'}else if(s>today){c='cx';t='kommt noch'}
  else if(v==='s'){c='cs';t='gelöst';ok++}else if(v==='f'){c='cf';t='nicht gelöst';bad++}else if(s===today){c='co';t='heute, noch offen'}else{c='cn';t='nicht gespielt'}
  cells+='<span class="'+c+(s===today?' ct':'')+'" title="'+wd+', '+p2(d)+'.'+p2(m+1)+'.'+y+': '+t+'">'+d+(v==='s'?'<i>✓</i>':v==='f'?'<i>✗</i>':'')+'</span>';}
 el.innerHTML='<div class="calh"><button data-cm="-1" '+(ym<=min?'disabled':'')+' aria-label="Vormonat">‹</button><b>'+MONATE[m]+' '+y+'</b><button data-cm="1" '+(ym>=max?'disabled':'')+' aria-label="Nächster Monat">›</button></div>'+
  '<div class="cal">'+WTAGE.map(w=>'<span class="wd">'+w+'</span>').join('')+cells+'</div>'+
  '<p class="mut">'+ok+' gelöst · '+bad+' nicht gelöst in diesem Monat.<br><span class="lgi"><span class="leg cs">✓</span> gelöst</span> <span class="lgi"><span class="leg cf">✗</span> nicht gelöst</span> <span class="lgi"><span class="leg cn"></span> nicht gespielt</span></p>';

const QKEY='waveChecker.quiz',QPTS=5; // Punkte je richtiger Antwort (gleiches Punktekonto wie die Spielmodi)
let QZ=null; // geladene Fragen
const qLoad=()=>{try{return JSON.parse(localStorage.getItem(QKEY))||{}}catch(_){return{}}}; // {cats:{Kategorie:{answered,correct,last:[1,0,…]}}, rep:{id:noch nötige richtige Antworten}, seen:{Kategorie:true}}
const qSave=o=>{try{localStorage.setItem(QKEY,JSON.stringify(o))}catch(_){}};
const QBEI={'Grundbegriffe & Fibonacci':'Bei den Grundbegriffen','Impuls':'Beim Impuls','Zigzag':'Beim Zigzag','Flats':'Bei den Flats','Dreiecke':'Bei Dreiecken','Diagonalen':'Bei Diagonalen','Komplexe Korrekturen':'Bei komplexen Korrekturen'};
const qChap=cat=>(QUIZKAP.find(x=>x[1]===cat)||[])[0]; // Kapitel der Lernseite zu einer Kategorie
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);

 if(cat&&!direct&&!(qLoad().seen||{})[cat]){ // vor dem ersten Quiz einer Kategorie
  $('#view').innerHTML='<div class="card"><h2>'+esc(cat)+'</h2><p>Lies zuerst das Kapitel, dann festigst du es im Quiz.</p><button class="p" id="qkap">Kapitel lesen</button><button class="p" id="qlos">Quiz starten</button><p><button onclick="quizMenu()">← Andere Kategorie</button></p></div>';
  $('#qkap').onclick=()=>peek(qChap(cat));$('#qlos').onclick=()=>quizRound(cat);document.querySelectorAll('#view button').forEach(lockTap);return}

function quizRound(cat){const o=qLoad(),rep=o.rep||{};o.seen=o.seen||{};if(cat)o.seen[cat]=true;qSave(o);
 const pool=QZ.filter(q=>!cat||q.kategorie===cat),due=shuffle(pool.filter(q=>rep[q.id])).slice(0,3); // Wiederholung: höchstens 3 je Runde

 quizAsk({cat,qs,i:0,res:[]});}
const quizKeep=(R,i)=>resSave({t:'quiz',cat:R.cat,ids:R.qs.map(q=>q.id),i,res:R.res.map(x=>({id:x.q.id,ok:x.ok}))});
function quizAsk(R){quizKeep(R,R.i);const q=R.qs[R.i],ord=q.typ==='mc'?shuffle(q.antworten.map((_,j)=>j)):q.antworten.map((_,j)=>j);let sel=null; // Multiple Choice: Antworten gemischt

  if(done){$('#qr').onclick=e=>{e.preventDefault();peek(q.abschnitt)};$('#qn').onclick=()=>{R.i++;R.i<R.qs.length?quizAsk(R):quizEnd(R)};return}
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{sel=+b.dataset.a;render()});
  $('#qg').onclick=()=>{const ok=sel===q.richtig,o=qLoad();o.cats=o.cats||{};o.rep=o.rep||{};
   const c=o.cats[q.kategorie]=o.cats[q.kategorie]||{answered:0,correct:0,last:[]};
   c.answered++;if(ok)c.correct++;c.last=c.last.concat(ok?1:0).slice(-30); // letzte 30 für die Ränge, die Schwäche nutzt die letzten 10
   if(!ok)o.rep[q.id]=2;else if(o.rep[q.id]&&!--o.rep[q.id])delete o.rep[q.id]; // bis zweimal richtig beantwortet
   qSave(o);if(ok){st.streak++;st.pts+=QPTS}else st.streak=0;stats();R.res.push({q,ok});quizKeep(R,R.i+1);rankCheck();
   render((ok?'<p class="ok">Richtig! +'+QPTS+' Punkte</p>':'<p class="bad">Leider falsch.</p><p>'+(q.typ==='rf'?'Die Aussage ist <b>'+esc(q.antworten[q.richtig]).toLowerCase()+'</b>.':'Richtig ist: <b>'+esc(q.antworten[q.richtig])+'</b>')+'</p>')+

// Rundenende. Schwäche: 2 Fehler einer Kategorie in dieser Runde oder unter 60 % in den letzten 10 Antworten (ab 5 Antworten)

// ---- 8) Ränge pro Kategorie (Bronze, Silber, Gold, Platin) und Gesamtrang „Elliott-Meister“.
// Quelle: Quiz-Daten (waveChecker.quiz) und gelöste Übungen (waveChecker.ranks, gezählt ab RSTART).
// Ein erreichter Rang geht nicht verloren (gespeichert in rank).
const RKEY='waveChecker.ranks',RSTART='23.10.2026';
const RCATS=['Grundbegriffe & Fibonacci','Impuls','Zigzag','Flats','Dreiecke','Diagonalen','Komplexe Korrekturen'];
const RCAT={imp:'Impuls',zig:'Zigzag',fr:'Flats',fe:'Flats',fru:'Flats',trk:'Dreiecke',tre:'Dreiecke',dl:'Diagonalen',db:'Diagonalen',de:'Diagonalen',dz:'Komplexe Korrekturen',tz:'Komplexe Korrekturen'};
const RIN={'Grundbegriffe & Fibonacci':'in Grundbegriffen & Fibonacci','Impuls':'in Impulsen','Zigzag':'in Zigzags','Flats':'in Flats','Dreiecke':'in Dreiecken','Diagonalen':'in Diagonalen','Komplexe Korrekturen':'in komplexen Korrekturen'};
const RNAME=['Noch kein Rang','Bronze','Silber','Gold','Platin'],REMO=['','🥉','🥈','🥇','💎'];
const rLoad=()=>{try{return JSON.parse(localStorage.getItem(RKEY))||{}}catch(_){return{}}}; // {ex:{Kategorie:{solved,noTip,hard}}, rank:{Kategorie:1..4}, master:true}
const rSave=o=>{try{localStorage.setItem(RKEY,JSON.stringify(o))}catch(_){}};
// Eine richtig abgeschlossene Runde (alle Spielmodi), zugeordnet nach dem Muster des Charts
function exSolved(key,tips,hard){const cat=RCAT[key];if(!cat)return;const o=rLoad();o.ex=o.ex||{};
 const e=o.ex[cat]=o.ex[cat]||{solved:0,noTip:0,hard:0};e.solved++;if(!tips)e.noTip++;if(hard)e.hard++;rSave(o);rankCheck();}
// Anforderungen des nächsten Rangs als Liste {have, need, txt}; or=true: eine davon reicht (Bronze)
function rNeeds(cat,lv){const q=(qLoad().cats||{})[cat]||{},e=(rLoad().ex||{})[cat]||{solved:0,noTip:0,hard:0},l=q.last||[],
 rate=l.length?l.reduce((a,b)=>a+b,0)/l.length:0,qc=q.correct||0,pct=x=>Math.round(x*100)+' %',R=(have,need,txt)=>({have,need,txt});
 const quiz=n=>R(rate,n,'mind. '+pct(n)+' im Quiz (aktuell '+pct(rate)+')');
 if(cat==='Grundbegriffe & Fibonacci'){const n=[10,25,50,100][lv-1],a=[R(qc,n,'Noch '+(n-qc)+' richtige Quiz-Antworten')];if(lv>1)a.push(quiz([0,0,.7,.8,.9][lv]));return{list:a}}
 if(lv===1)return{or:true,list:[R(qc,10,'Noch '+(10-qc)+' richtige Quiz-Antworten'),R(e.solved,10,(10-e.solved)+' gelöste Übungen')]};
 const n=[0,0,30,50,100][lv],a=[R(e.solved,n,'Noch '+(n-e.solved)+' gelöste Übungen'),quiz([0,0,.7,.8,.9][lv])];
 if(lv===3)a.push(R(e.noTip,10,'noch '+(10-e.noTip)+' Übungen ohne Tipp'));
 if(lv===4)a.push(R(e.hard,20,'noch '+(20-e.hard)+' Übungen in „Muster erkennen – Schwer“ oder der Tagesaufgabe'));
 return{list:a};}
const rMet=x=>x.or?x.list.some(r=>r.have>=r.need):x.list.every(r=>r.have>=r.need);
function rCalc(cat){let lv=0;while(lv<4&&rMet(rNeeds(cat,lv+1)))lv++;return lv}
// Neue Ränge speichern und einblenden; quiet: ohne Einblendung
function rankCheck(quiet){const o=rLoad();o.rank=o.rank||{};const msgs=[];
 RCATS.forEach(c=>{const lv=Math.max(o.rank[c]||0,rCalc(c));if(lv>(o.rank[c]||0)){o.rank[c]=lv;msgs.push('Neuer Rang: '+RNAME[lv]+' '+RIN[c]+'!')}});
 if(!o.master&&RCATS.every(c=>(o.rank[c]||0)>=3)){o.master=true;msgs.push('Neuer Gesamtrang: Elliott-Meister!')}
 rSave(o);if(msgs.length&&!quiet)toast(msgs.join('<br>'));}
function toast(html){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}

  '<div class="card'+(o.master?' daily':'')+'"><b>Gesamtrang Elliott-Meister</b> '+(o.master?badge(4).replace('Platin','Elliott-Meister'):'<span class="mut">alle Kategorien mindestens Gold ('+RCATS.filter(c=>((o.rank||{})[c]||0)>=3).length+' von '+RCATS.length+')</span>')+

  RCATS.map((c,i)=>{const lv=(o.rank||{})[c]||0,e=ex[c]||{solved:0,noTip:0,hard:0},q=qc[c]||{},l=q.last||[],nx=lv<4?rNeeds(c,lv+1):null;
   const prog=nx?(nx.or?Math.max(...nx.list.map(r=>Math.min(1,r.have/r.need))):nx.list.reduce((s,r)=>s+Math.min(1,r.have/r.need),0)/nx.list.length):1;
   const open=nx?nx.list.filter(r=>r.have<r.need).map(r=>r.txt):[];
   return '<div class="card"><h2>'+esc(c)+' '+badge(lv)+'</h2><p class="mut">Quiz: '+(q.correct||0)+' richtig'+(l.length?', '+Math.round(l.reduce((a,b)=>a+b,0)/l.length*100)+' % der letzten '+l.length:'')+
    (c==='Grundbegriffe & Fibonacci'?'':' · Übungen: '+e.solved+' gelöst, '+e.noTip+' ohne Tipp, '+e.hard+' schwer/Tagesaufgabe')+'</p>'+
    (nx?'<div class="bar"><i style="width:'+Math.round(prog*100)+'%"></i></div><p>Bis '+RNAME[lv+1]+': '+open.join(nx.or?' oder ':' und ')+'.</p>':'<p class="ok">Höchster Rang erreicht.</p>')+

    (lv<4?'<div id="earn-'+i+'" hidden>'+earnOpts(c,lv)+'</div>':'')+'</div>'}).join('')+
  '<p id="shareMsg" class="mut"></p>'+(fromLearn?'<p><button onclick="showLearn()">← Zum Regelwerk</button></p>':'');
 // „Rang verdienen“ klappt die passenden Übungen der Kategorie auf
